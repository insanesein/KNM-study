
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --font-sans: 'Nunito', sans-serif;
  --color-background-primary: #ffffff;
  --color-background-secondary: #f5f5f7;
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #6b6b6b;
  --color-border-primary: #c8c8c8;
  --color-border-secondary: #dedede;
  --color-border-tertiary: #ebebeb;
  --border-radius-md: 10px;
  --border-radius-lg: 14px;
}
/* ── BASE ─────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; font-family: var(--font-sans) !important; }
.wrap { padding: 1rem 24px; }

/* ── HEADER ──────────────────────────────────────────────────────────────── */
.header-box { background: none; border: none; border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header-left h2 { font-size: 24px; font-weight: 700; margin: 0 0 4px; color: var(--color-text-primary); }
.header-left p { font-size: 14px; color: var(--color-text-secondary); margin: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.hdr-btn { font-size: 14px; padding: 9px 16px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; font-weight: 500; white-space: nowrap; min-height: 40px; }
.hdr-btn.on { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
.hdr-btn.exam-btn { background: #7C3AED; color: #ffffff; border: none; }

/* ── TOPIC NAV ───────────────────────────────────────────────────────────── */
.topics-nav { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 0.75rem; }
.topic-btn { font-size: 13px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; min-height: 0; }

/* ── SEARCH ──────────────────────────────────────────────────────────────── */
.search-wrap { position: relative; margin-bottom: 1.25rem; }
.search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
#searchInput { width: 100%; padding: 10px 14px 10px 36px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); color: var(--color-text-primary); font-size: 14px; outline: none; min-height: 40px; }
#searchInput:focus { border-color: #378ADD; box-shadow: 0 0 0 2px rgba(55,138,221,0.12); }
#searchInput::placeholder { color: var(--color-text-secondary); opacity: 0.7; }
#searchResults { display: none; }
.search-topic-label { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
.search-empty { text-align: center; color: var(--color-text-secondary); padding: 2.5rem 1rem; font-size: 15px; }

/* ── SECTION HEADER ──────────────────────────────────────────────────────── */
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; padding-bottom: 8px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.section-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; flex-shrink: 0; }
.section-title { font-size: 17px; font-weight: 500; color: var(--color-text-primary); margin: 0; }
.section-sub { font-size: 13px; color: var(--color-text-secondary); margin: 0; }
.count-badge { font-size: 12px; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; font-weight: 400; }

/* ── WORD CARD ───────────────────────────────────────────────────────────── */
.word-card { background: #fcfcfd; border: none; border-radius: 8px; padding: 0.875rem 1rem; margin-bottom: 10px; }
.word-title-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 8px; }
.word-title { font-size: 16px; font-weight: 700; color: #1a1a1a; margin: 0; flex: 1; line-height: 1.4; }
.speak-title { opacity: 0.4; margin-top: 1px; }
.word-body { font-size: 14px; color: #1a1a1a; line-height: 1.65; margin: 0; padding-left: 28px; }
.word-body li { margin-bottom: 2px; list-style: disc; }
.example-box { background: var(--color-background-secondary); border-left: 3px solid var(--color-border-secondary); border-radius: 0 6px 6px 0; padding: 7px 10px; margin-top: 10px; }
.example-label { font-size: 12px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.07em; display: block; margin-bottom: 5px; opacity: 0.7; }

/* ── SENTENCE ROW (dutch text + speaker) ─────────────────────────────────── */
.sentence-row { display: flex; align-items: center; gap: 4px; }
.nl-text { flex: 1; line-height: 1.6; }
.speak-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px 4px; opacity: 0.35; transition: opacity 0.18s; flex-shrink: 0; margin-top: 1px; line-height: 1; min-width: 28px; min-height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.speak-btn:hover, .speak-btn:active { opacity: 1; background: var(--color-background-secondary); }
.speak-btn.speaking { opacity: 1; animation: pulse 0.9s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── PER-SENTENCE ENGLISH TRANSLATION ───────────────────────────────────── */
.en-line { font-size: 13px; color: var(--color-text-secondary); line-height: 1.5; margin: 3px 0 8px 0; padding: 4px 8px 4px 10px; border-left: 2px solid var(--color-border-tertiary); font-style: italic; opacity: 0.82; }
.en-line.en-loading { opacity: 0.45; animation: shimmer 1.4s infinite; }
@keyframes shimmer { 0%{opacity:0.3}50%{opacity:0.7}100%{opacity:0.3} }
.translate-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px 4px; opacity: 0.35; transition: opacity 0.18s; flex-shrink: 0; margin-top: 1px; line-height: 1; min-width: 28px; min-height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.translate-btn:hover, .translate-btn:active { opacity: 1; background: var(--color-background-secondary); }
.translate-btn.active { opacity: 1; }



/* ── EXAM ─────────────────────────────────────────────────────────────────── */
.exam-wrap { padding: 0; }
.exam-timer { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-text-primary); letter-spacing: 0.03em; min-width: 62px; text-align: right; }
.timer-urgent { color: #c53030; animation: timerPulse 1s infinite; }
@keyframes timerPulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
.saved-btn { position: relative; background: #F5C842; color: #1a1a1a; border: none; }
.saved-btn.active { background: #F5C842; border-color: #F5C842; color: #1a1a1a; }
.save-word-btn { background: none; border: none; cursor: pointer; font-size: 15px; opacity: 0.3; transition: opacity 0.18s, transform 0.15s; padding: 0; margin: 0; flex-shrink: 0; line-height: 1; min-width: 22px; min-height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.save-word-btn:hover { opacity: 0.7; }
.save-word-btn.saved { opacity: 1; transform: scale(1.1); }
.saved-category-label { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 20px; display: inline-block; margin-bottom: 8px; letter-spacing: 0.02em; }
.saved-empty { text-align: center; color: var(--color-text-secondary); padding: 3rem 1rem; font-size: 15px; }
.saved-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.saved-panel-header h3 { font-size: 17px; font-weight: 600; margin: 0; color: #1a1a1a; }
.clear-saved-btn { font-size: 13px; color: #999; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.clear-saved-btn:hover { color: #c53030; }
.exam-top { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
.exam-top h2 { font-size: 19px; font-weight: 500; margin: 0 0 4px; color: var(--color-text-primary); }
.exam-top p { font-size: 14px; color: var(--color-text-secondary); margin: 0; }
.exam-theme-header { font-size: 14px; font-weight: 600; color: var(--color-text-secondary); padding: 18px 4px 6px; border-bottom: 1.5px solid var(--color-border-tertiary); margin: 8px 0 4px; letter-spacing: 0.02em; }
.q-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 1rem 1.1rem; margin-bottom: 12px; }
.q-num { font-size: 12px; color: var(--color-text-secondary); margin: 0 0 4px; }
.q-text { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 10px; line-height: 1.5; }
.opt-btn { display: block; width: 100%; text-align: left; font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 0.5px solid #e8e8e8; background: #fafafa; color: var(--color-text-primary); cursor: pointer; margin-bottom: 6px; line-height: 1.4; min-height: 42px; }
.opt-btn:last-child { margin-bottom: 0; }
.opt-btn.selected { border-color: #378ADD; background: #E6F1FB; color: #185FA5; }
.opt-btn.correct { border-color: #639922; background: #EAF3DE; color: #3B6D11; }
.opt-btn.wrong { border-color: #E24B4A; background: #FCEBEB; color: #A32D2D; }
.opt-btn:disabled { cursor: default; }
.submit-row { margin-top: 1.5rem; text-align: center; }
.submit-btn { font-size: 15px; padding: 12px 32px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; font-weight: 500; min-height: 46px; }
.submit-btn:disabled { opacity: 0.4; cursor: default; }
.result-box { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; text-align: center; margin-bottom: 1.5rem; }
.result-score { font-size: 36px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 6px; }
.result-label { font-size: 15px; color: var(--color-text-secondary); margin: 0 0 16px; }
.result-badge { display: inline-block; font-size: 15px; font-weight: 500; padding: 6px 20px; border-radius: 20px; margin-bottom: 16px; }
.result-badge.pass { background: #EAF3DE; color: #3B6D11; }
.result-badge.fail { background: #FCEBEB; color: #A32D2D; }
.restart-btn { font-size: 15px; padding: 10px 22px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; font-weight: 500; margin: 4px 4px; min-height: 42px; }
.progress-bar-wrap { height: 4px; background: var(--color-border-tertiary); border-radius: 2px; margin-bottom: 1.25rem; }
.progress-bar-inner { height: 4px; background: #378ADD; border-radius: 2px; transition: width 0.3s; }

/* ── MOBILE RESPONSIVE ───────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .header-box { padding: 0.85rem 1rem; gap: 8px; }
  .header-left h2 { font-size: 16px; }
  .header-left p { font-size: 12px; }
  .hdr-btn { font-size: 13px; padding: 8px 12px; }
  .topic-btn { font-size: 12px; padding: 6px 10px; }
  .word-title { font-size: 15px; }
  .word-body { font-size: 14px; padding-left: 10px; }
  .section-title { font-size: 15px; }
  .q-text { font-size: 14px; }
  .opt-btn { font-size: 14px; padding: 10px 10px; }
  .restart-btn { padding: 10px 14px; font-size: 14px; margin: 3px 2px; }
  #searchInput { font-size: 16px; } /* prevent iOS zoom */
  .en-line { font-size: 12px; }
  .speak-btn { font-size: 17px; }
}
@media (max-width: 380px) {
  .btn-row { gap: 5px; }
  .hdr-btn { font-size: 12px; padding: 7px 10px; }
}
</style>

<div class="wrap" id="mainWrap">
  <div class="header-box">
    <div class="header-left">
      <h2>KNM Studiegids — Alle 8 Thema's</h2>
    </div>

      <button class="hdr-btn saved-btn" id="savedBtn" onclick="toggleSaved()">🔖 Saved <span id="savedCount"></span></button>
      <button class="hdr-btn exam-btn" onclick="startExam()">📝 Practice Exam</button>
    </div>
  </div>
  <div class="topics-nav" id="nav"></div>

    <input type="text" id="searchInput" placeholder="Zoek een begrip..." oninput="handleSearch(event)" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div id="searchResults"></div>
  <div id="savedPanel" style="display:none;"></div>
  <div id="content"></div>
</div>

<div id="examWrap" style="display:none;" class="exam-wrap">
  <div id="examInner"></div>
</div>


<script>

var colorMap = {
  teal:{bg:"#E1F5EE",text:"#0F6E56"},

  gray:{bg:"#F1EFE8",text:"#5F5E5A"},
  pink:{bg:"#FBEAF0",text:"#993556"}
};

var topics = [
  // ─── 1. GEZONDHEID ──────────────────────────────────────────────────────────
  { id:"gezondheid", emoji:"🏥", title:"Gezondheid & Gezondheidszorg", sub:"Healthcare", color:"teal",
    words:[
      { w:"Huisarts (GP — general practitioner)", en:"The GP is the first doctor you contact when you are ill. You need a referral to see a specialist.", nl:["De huisarts is de eerste dokter die je bezoekt als je ziek bent.","Je maakt altijd eerst een afspraak bij de huisarts. Je kunt niet zomaar langskomen.","Je kunt niet zomaar naar een specialist gaan. De huisarts verwijst jou door als dat nodig is."] },
      { w:"POH — Praktijkondersteuner Huisarts (GP Practice Support Worker)", en:"Works alongside the GP with more time per patient. Specialises in chronic conditions and mental health.", nl:["De POH is een medewerker in de huisartsenpraktijk die de huisarts helpt.","De POH heeft meer tijd voor een patiënt dan de huisarts.","Je gaat naar de POH bij chronische klachten, zoals diabetes of psychische problemen."] },
      { w:"Zorgverzekering (health insurance)", en:"Health insurance is mandatory for everyone in the Netherlands. You pay a monthly premium.", nl:["Een zorgverzekering betaalt voor je medische zorg als je ziek bent.","In Nederland moet iedereen een zorgverzekering hebben. Dit is verplicht.","Je betaalt elke maand premie aan een zorgverzekeraar, zoals Zilveren Kruis of VGZ."] },
      { w:"Eigen risico (own-risk deductible)", en:"The amount you pay yourself each year (€385 in 2025) before insurance covers the rest.", nl:["Het eigen risico is het bedrag dat je zelf betaalt voordat de verzekering betaalt.","In 2025 is het eigen risico €385 per jaar.","De huisarts valt niet onder het eigen risico. De apotheek en het ziekenhuis soms wel."] },
      { w:"Zorgtoeslag (healthcare allowance)", en:"Government allowance to help pay insurance premium for people with a low income.", nl:["Zorgtoeslag is geld van de overheid om je zorgverzekering te helpen betalen.","Als je weinig verdient, kun je zorgtoeslag aanvragen.","Je vraagt zorgtoeslag aan bij de Belastingdienst via DigiD."] },
      { w:"112 & Hulpdiensten (emergency services)", en:"Call 112 for emergencies. 0900-8844 for non-urgent police. 113 for mental health crisis.", nl:["Bel 112 bij een noodgeval, zoals een brand, een ongeluk of iemand die bewusteloos is.","Bel 0900-8844 voor de politie als het niet dringend is.","Bel 113 als jij of iemand anders in een psychische crisis is of suïcidale gedachten heeft."] },
      { w:"HAP — Huisartsenpost (GP Out-of-Hours Post)", en:"Out-of-hours GP open evenings and weekends. Always call first before going.", nl:["De HAP is een dokterspost die open is buiten de normale kantooruren.","De HAP is 's avonds, in het weekend en op feestdagen open.","Je moet altijd eerst bellen voordat je naar de HAP gaat."] },
      { w:"SEH — Spoedeisende Hulp (Emergency Department)", en:"Hospital emergency department for serious urgent cases only. Not for minor complaints.", nl:["De SEH is de afdeling in het ziekenhuis voor ernstige spoedgevallen.","Ga alleen naar de SEH als het heel ernstig is, zoals bij een hartaanval of een ernstig ongeluk.","Voor kleine klachten ga je naar de huisarts of de HAP."] },
      { w:"Apotheek (pharmacy)", en:"Pharmacy provides prescribed medicines and advice on medications.", nl:["Bij de apotheek haal je medicijnen op met een recept van de dokter.","De apotheek geeft ook advies over medicijnen en mogelijke bijwerkingen.","Je kunt ook zonder recept sommige eenvoudige medicijnen kopen bij de apotheek."] },
      { w:"Verloskundige (midwife)", en:"Midwife supervises normal pregnancies and births. Refers to specialist if needed.", nl:["Een verloskundige helpt zwangere vrouwen tijdens de zwangerschap en de bevalling.","In Nederland bevallen veel vrouwen thuis met hulp van een verloskundige.","Bij problemen of risico's verwijst de verloskundige door naar een gynaecoloog."] },
      { w:"GGZ — Geestelijke Gezondheidszorg (Mental Healthcare)", en:"Mental healthcare services covering therapy and psychiatry. A GP referral is required.", nl:["De GGZ geeft hulp aan mensen met psychische problemen, zoals depressie of angststoornissen.","Je hebt een verwijzing van de huisarts nodig om naar de GGZ te gaan.","Bij de GGZ werken psychologen, psychiaters en andere specialisten."] },
      { w:"Tandarts (dentist)", en:"Children under 18 covered by basic insurance. Adults need extra dental insurance.", nl:["De tandarts zorgt voor de gezondheid van je tanden en mond.","Kinderen tot 18 jaar gaan gratis naar de tandarts via de basisverzekering.","Volwassenen betalen zelf voor de tandarts, tenzij ze een aanvullende verzekering hebben."] },
      { w:"Medisch beroepsgeheim & toestemming (medical confidentiality & consent)", en:"A doctor may not share your medical information with others. You must give permission for treatment.", nl:["Het medisch beroepsgeheim betekent dat de dokter jouw informatie niet mag delen met anderen.","De dokter heeft jouw toestemming nodig voordat hij een medische behandeling uitvoert.","Kinderen van 16 jaar of ouder mogen zelf toestemming geven voor medische zorg."] },
      { w:"Tolk & vertaler (interpreter & translator)", en:"A medical interpreter translates during doctor appointments. You can request one.", nl:["Een tolk helpt als je de taal van de dokter niet goed spreekt door te vertalen wat de dokter zegt.","In de gezondheidszorg kun je een professionele tolk aanvragen.","Een tolk vertaalt gesproken taal. Een vertaler vertaalt geschreven tekst."] },
      { w:"Polikliniek & specialist (outpatient clinic & specialist)", en:"An outpatient clinic is a hospital department where you see a specialist without being admitted overnight.", nl:["Een polikliniek is een afdeling van het ziekenhuis waar je naartoe gaat zonder opname.","Bij de polikliniek zie je een specialist, zoals een cardioloog of een orthopeed.","Je hebt een verwijsbrief van de huisarts nodig om naar de polikliniek te gaan."] },
      { w:"Verwijsbrief & doorverwijzing (referral letter & referral)", en:"A referral letter from the GP is needed to see a specialist. Without it, insurance does not pay.", nl:["Een verwijsbrief is een brief van de huisarts die zegt dat je naar een specialist moet.","Zonder verwijsbrief betaalt de zorgverzekering de kosten van de specialist meestal niet.","De huisarts verwijst jou door als hij of zij denkt dat je gespecialiseerde zorg nodig hebt."] },
      { w:"Herhaalrecept (repeat prescription)", en:"A repeat prescription is for medicines you use regularly. You can request it without an appointment.", nl:["Een herhaalrecept is een nieuw recept voor medicijnen die je al een lange tijd gebruikt.","Je kunt een herhaalrecept aanvragen bij de huisarts of via de apotheek.","Je hoeft niet altijd naar de huisarts voor een herhaalrecept. Soms gaat het online of per telefoon."] },
      { w:"Medisch dossier & patiëntendossier (medical record / patient file)", en:"Your medical record contains your full health history. You have the right to view it at any time.", nl:["Een medisch dossier is een overzicht van al jouw medische informatie, zoals diagnoses en gebruikte medicijnen.","De huisarts bewaart jouw dossier. Alleen medische professionals mogen het inzien.","Je hebt altijd het recht om je eigen medisch dossier op te vragen en in te zien."] },
      { w:"Spreekuur & consult (surgery hours & consultation)", en:"The GP holds surgery hours every day. You make an appointment to speak with the GP about your complaints.", nl:["Het spreekuur is de tijd waarop je de huisarts kunt bezoeken voor een consult.","Je maakt van tevoren een afspraak voor het spreekuur. Je kunt ook bellen voor advies.","Een consult is een gesprek met de dokter over jouw klachten. Soms kan dat ook telefonisch."] }
    ]
  },

  // ─── 2. WONEN ───────────────────────────────────────────────────────────────
  { id:"wonen", emoji:"🏠", title:"Wonen", sub:"Housing", color:"blue",

      { w:"Huurtoeslag (rent allowance)", en:"Government rent allowance for low-income tenants. Apply via DigiD at the Belastingdienst.", nl:["Huurtoeslag is geld van de overheid om je huur te helpen betalen.","Als je weinig verdient en een huurwoning hebt, kun je huurtoeslag aanvragen.","Je vraagt huurtoeslag aan bij de Belastingdienst via DigiD."] },
      { w:"BRP — Basisregistratie Personen (Personal Records Database)", en:"Register your new address at the municipality within 5 days of moving. Legally required.", nl:["De BRP is een register bij de gemeente met informatie over alle inwoners.","Als je verhuist, moet je je binnen 5 dagen inschrijven bij de gemeente in de BRP.","De BRP registreert je naam, adres, geboortedatum en andere persoonlijke gegevens."] },
      { w:"Huurcontract (rental contract)", en:"Rental contract states rent, rules and duration. Always read before signing.", nl:["Een huurcontract is een overeenkomst tussen jou en de verhuurder.","In het huurcontract staan de huurprijs, de regels en de duur van de huur.","Lees altijd het huurcontract goed voordat je het tekent."] },
      { w:"Servicekosten (service charges)", en:"Service charges for gas, water, electricity and maintenance on top of rent.", nl:["Servicekosten zijn extra kosten die je naast de huurprijs betaalt.","Servicekosten kunnen zijn voor gas, water, schoonmaak of onderhoud van het gebouw.","De verhuurder moet elk jaar een overzicht geven van de servicekosten."] },
      { w:"Afvalscheiding (waste separation)", en:"Separate waste into paper, plastic, glass, organic and residual. Rules vary per municipality.", nl:["Afvalscheiding betekent dat je je afval sorteert in verschillende categorieën.","In Nederland gooi je afval gescheiden weg: papier, plastic, glas, GFT en restafval.","Elke gemeente heeft eigen regels voor hoe je afval moet scheiden."] },
      { w:"Huurcommissie (rent tribunal)", en:"Independent tribunal for disputes between tenants and landlords about rent or service charges.", nl:["De Huurcommissie helpt bij problemen tussen de huurder en de verhuurder.","Als je een conflict hebt over de huurprijs, kun je naar de Huurcommissie gaan.","De Huurcommissie doet een onafhankelijke uitspraak over het probleem."] },
      { w:"Hypotheek (mortgage)", en:"Bank loan to buy a house. The house is security for the loan.", nl:["Een hypotheek is een lening van de bank waarmee je een huis kunt kopen.","Je betaalt de hypotheek elke maand terug aan de bank, met rente.","Als je niet terugbetaalt, kan de bank het huis verkopen."] },
      { w:"Nutsvoorzieningen (utilities)", en:"Gas, water and electricity. You arrange your own energy contract with a supplier.", nl:["Nutsvoorzieningen zijn gas, water en elektriciteit die je nodig hebt in huis.","Je sluit zelf een contract af met een energieleverancier voor gas en elektriciteit.","Als je verhuist, geef je je meterstanden door aan de energieleverancier."] },
      { w:"Overlast & burenrecht (nuisance & neighbour law)", en:"You must not cause nuisance to neighbours. Complaints go to landlord or municipality.", nl:["Overlast betekent dat jij jouw buren last bezorgt, zoals met harde muziek of veel rommel.","Je mag je buren geen overlast bezorgen. Dit is ook bij wet geregeld.","Overlast meld je bij de verhuurder of de gemeente."] },
      { w:"VvE — Vereniging van Eigenaren (Homeowners' Association)", en:"All apartment owners are automatically members. The VvE manages shared areas and maintenance.", nl:["Een VvE is een groep van alle eigenaren in een appartementengebouw.","Als je een appartement koopt, word je automatisch lid van de VvE.","De VvE regelt het onderhoud van gemeenschappelijke ruimtes, zoals de lift en het dak."] },
      { w:"Makelaar (estate agent)", en:"A real estate agent helps you buy, sell or rent a property.", nl:["Een makelaar helpt mensen bij het kopen, verkopen of huren van een huis.","De makelaar kent de huizenmarkt goed en geeft je advies.","Je betaalt de makelaar een vergoeding voor zijn of haar diensten."] },
      { w:"Een bod doen (making an offer)", en:"When you want to buy a house, you make an offer. The seller can accept, reject or negotiate.", nl:["Een bod doen betekent dat je een prijs biedt voor een huis dat je wilt kopen.","Je kunt een bod uitbrengen via een makelaar of direct aan de verkoper.","Als de verkoper het bod accepteert, begint het officiële koopproces."] },
      { w:"Borg (security deposit)", en:"A deposit (often one or two months' rent) paid to the landlord before moving in.", nl:["Een borg is een geldbedrag dat je betaalt aan de verhuurder voordat je intrekt.","De borg is een soort garantie. Je krijgt het terug als je de woning goed achterlaat.","De borg is vaak één of twee maanden huur."] },
      { w:"Juridisch Loket (Legal Aid Desk)", en:"Free legal advice on housing, employment or debt for people with a low income.", nl:["Het Juridisch Loket geeft gratis juridisch advies aan mensen.","Je kunt er terecht voor vragen over huur, werk, schulden of andere rechtszaken.","Het Juridisch Loket is voor mensen met weinig geld die geen dure advocaat kunnen betalen."] },
      { w:"Verzekeringen: WA-verzekering & AVP — Aansprakelijkheidsverzekering voor Particulieren (liability & personal liability insurance)", en:"WA covers damage you cause to others with a vehicle. AVP covers personal accidental damage to others.", nl:["Een verzekering beschermt je als er iets ergs gebeurt. Je betaalt dan niet alles zelf.","Een WA-verzekering betaalt voor schade die je met je auto of fiets aan anderen maakt.","Een AVP — aansprakelijkheidsverzekering voor particulieren — betaalt als jij per ongeluk iemands spullen kapot maakt."] },
      { w:"Dienst Toeslagen (Benefits Service)", en:"The Dienst Toeslagen manages all government allowances: rent, healthcare, childcare and child benefit.", nl:["Dienst Toeslagen is een onderdeel van de Belastingdienst dat toeslagen regelt.","Je kunt hier zorgtoeslag, huurtoeslag, kinderopvangtoeslag en kindgebonden budget aanvragen.","Je vraagt toeslagen aan via DigiD op de website van de Belastingdienst."] },
      { w:"Vast tarief & variabel tarief (fixed rate & variable rate)", en:"A fixed energy tariff stays stable for a set period. A variable tariff changes with the market price.", nl:["Een vast tarief betekent dat je voor een bepaalde periode elke maand hetzelfde bedrag betaalt voor energie.","Een variabel tarief kan elke maand anders zijn. Het hangt af van de energieprijs op de markt.","Met een vast tarief weet je zeker hoeveel je betaalt. Dat is handig voor je budget."] },
      { w:"Jaarrekening (annual energy bill)", en:"Once a year your energy supplier calculates if you paid too much or too little.", nl:["Een jaarrekening is een overzicht van wat je het hele jaar hebt betaald voor energie.","Je energieleverancier stuurt elk jaar een jaarrekening. Je ziet dan of je te veel of te weinig hebt betaald.","Als je te veel hebt betaald, krijg je geld terug. Als je te weinig hebt betaald, moet je bijbetalen."] },
      { w:"Energie besparen (saving energy)", en:"Saving energy reduces your monthly bill and is better for the environment.", nl:["Energie besparen betekent dat je minder gas, water of elektriciteit gebruikt.","Je kunt energie besparen door de verwarming lager te zetten of de lichten uit te doen als je de kamer verlaat.","Minder energie gebruiken is goed voor het milieu en het bespaart geld."] },
      { w:"Afvalinzameling (waste collection)", en:"The municipality collects waste on set days. Different containers for different types of waste.", nl:["Afvalinzameling betekent dat de gemeente je afval op vaste dagen ophaalt.","Je zet de juiste container op straat op de dag dat de gemeente het afval ophaalt.","Elke gemeente heeft eigen regels voor afvalinzameling. Kijk op de website van je gemeente."] },
      { w:"Gemeentelijke belastingen & OZB — Onroerendezaakbelasting (local taxes & property tax)", en:"You pay local taxes to the municipality, such as property tax (OZB) and sewage levy. Renters pay less than owners.", nl:["Gemeentelijke belastingen zijn belastingen die je betaalt aan de gemeente waar je woont.","De OZB — onroerendezaakbelasting — betalen eigenaren van een huis aan de gemeente.","Huurders betalen minder gemeentelijke belastingen dan huiseigenaren."] },
      { w:"Inburgering & inburgeringsexamen (civic integration & integration exam)", en:"Newcomers must learn Dutch and pass the civic integration exam within 3 years. It includes language and KNM.", nl:["Inburgering betekent dat je de Nederlandse taal leert en kennis opdoet over de Nederlandse samenleving.","Veel nieuwe inwoners zijn verplicht om het inburgeringsexamen te halen binnen drie jaar.","Het inburgeringsexamen bestaat uit meerdere onderdelen, waaronder taal en het KNM-examen."] }
    ]
  },

  // ─── 3. WERK & INKOMEN ──────────────────────────────────────────────────────
  { id:"werk", emoji:"💼", title:"Werk & Inkomen", sub:"Work & Income", color:"amber",
    words:[
      { w:"UWV — Uitvoeringsinstituut Werknemersverzekeringen (Employee Insurance Agency)", en:"Manages unemployment and disability benefits. Apply for WW here when losing a job.", nl:["UWV is een overheidsorganisatie die uitkeringen geeft aan mensen die niet kunnen werken.","Bij UWV vraag je een WW-uitkering aan als je je baan verliest.","UWV controleert ook of je actief zoekt naar een nieuwe baan."] },
      { w:"WW — Werkloosheidswet & WW-uitkering (Unemployment Insurance & benefit)", en:"Unemployment benefit for a limited period after redundancy. Must actively seek work.", nl:["De WW is een uitkering voor mensen die hun baan verliezen buiten hun eigen schuld.","Je vraagt de WW-uitkering aan bij het UWV — Uitvoeringsinstituut Werknemersverzekeringen.","Als je een WW-uitkering ontvangt, moet je actief solliciteren naar een nieuwe baan."] },
      { w:"Bijstandsuitkering (social assistance benefit)", en:"Minimum income benefit from the municipality if you have no income and no WW right.", nl:["Bijstand is een uitkering van de gemeente voor mensen die geen inkomen hebben.","Je vraagt bijstand aan bij de gemeente als je geen recht hebt op WW.","Bijstand is bedoeld als tijdelijke hulp totdat je weer werk vindt."] },
      { w:"Arbeidscontract & arbeidsovereenkomst (employment contract)", en:"Employment contract sets out hours, salary and obligations. Fixed-term or permanent.", nl:["Een arbeidscontract is een overeenkomst tussen de werknemer en de werkgever.","In het contract staan je werktijden, salaris, rechten en plichten.","Een tijdelijk contract heeft een einddatum. Een vast contract niet."] },
      { w:"Minimumloon (minimum wage)", en:"Government-set minimum wage, adjusted twice a year. Under-21s receive a lower youth rate.", nl:["Het minimumloon is het laagste bedrag dat een werkgever wettelijk mag betalen.","Werknemers van 21 jaar en ouder hebben recht op het volledige minimumloon. Jongeren van 15 tot 20 jaar krijgen een lager minimumjeugdloon.","Het minimumloon wordt twee keer per jaar aangepast."] },
      { w:"CAO — Collectieve Arbeidsovereenkomst (collective labour agreement)", en:"Collective labour agreement between employers and unions on wages and conditions.", nl:["Een CAO is een schriftelijke afspraak over salaris en arbeidsvoorwaarden in een bepaalde sector.","De CAO wordt gemaakt door werkgevers en vakbonden samen.","Als er een CAO geldt voor jouw werk, heb je automatisch recht op de afgesproken voorwaarden."] },
      { w:"Loonstrook & loonheffing (pay slip & income tax)", en:"Monthly pay slip showing gross pay, tax deducted and net pay.", nl:["Een loonstrook is een overzicht van je salaris en wat ervan wordt afgetrokken.","Op je loonstrook zie je je brutoloon, de loonheffing en je nettoloon.","De werkgever betaalt de loonheffing direct aan de Belastingdienst."] },
      { w:"ZZP'er — Zelfstandige Zonder Personeel (self-employed worker without staff)", en:"Self-employed worker who must register at the KvK and arrange own insurance and pension.", nl:["Een ZZP'er is iemand die voor zichzelf werkt en geen eigen personeel heeft.","Een ZZP'er schrijft zich in bij de KvK — Kamer van Koophandel.","ZZP'ers regelen zelf hun belasting, pensioen en verzekeringen."] },
      { w:"AOW — Algemene Ouderdomswet & pensioen (State Old Age Pension)", en:"State pension (AOW) from the SVB from age 67. Often supplemented by a workplace pension.", nl:["AOW is een uitkering van de overheid voor mensen die de pensioenleeftijd hebben bereikt.","Je ontvangt AOW van de SVB — Sociale Verzekeringsbank — vanaf 67 jaar.","Veel werkgevers bieden ook een aanvullend pensioen bovenop de AOW."] },
      { w:"Solliciteren & motivatiebrief (applying for a job & motivation letter)", en:"Apply with CV and motivation letter. If selected, you are invited to a job interview.", nl:["Solliciteren betekent dat je reageert op een vacature en vraagt om een baan.","Bij solliciteren stuur je een CV — curriculum vitae — en een motivatiebrief.","Als de werkgever interesse heeft, word je uitgenodigd voor een sollicitatiegesprek."] },
      { w:"Brutoloon (gross salary)", en:"Gross salary is your total salary before tax and other deductions are subtracted.", nl:["Brutoloon is het totale salaris dat je verdient, vóór aftrek van belasting en premies.","Van je brutoloon worden loonheffing en sociale premies afgetrokken.","Je brutoloon staat in je arbeidscontract en op je loonstrook."] },
      { w:"Nettoloon (net salary)", en:"Net salary is what you actually receive in your bank account after all deductions.", nl:["Nettoloon is het geld dat je echt ontvangt na alle aftrekposten.","Je nettoloon is lager dan je brutoloon, omdat er belasting van wordt afgetrokken.","Het nettoloon wordt elke maand op je bankrekening gestort."] },
      { w:"Deeltijdwerk (part-time work)", en:"Part-time work means working fewer than the standard full-time hours, often 20–32 hours per week.", nl:["Deeltijdwerk betekent dat je minder uren werkt dan fulltime.","In Nederland werken veel mensen, ook vaders en moeders, in deeltijd.","Je hebt dezelfde rechten als een fulltime medewerker, maar dan naar rato van je uren."] },
      { w:"OR — Ondernemingsraad (Works Council)", en:"Workers' representative body in companies with 50+ employees. Has rights to advice and consent.", nl:["De OR is een groep werknemers die de belangen van alle werknemers in een bedrijf vertegenwoordigt.","Bedrijven met meer dan 50 werknemers zijn verplicht een OR te hebben.","De OR heeft het recht om mee te praten over belangrijke beslissingen van het bedrijf."] },
      { w:"Rechten & plichten van werknemers (employee rights & duties)", en:"Employees have rights such as minimum wage and safe conditions, and duties such as performing agreed work.", nl:["Als werknemer heb je rechten, zoals recht op minimumloon, vakantiedagen en een veilige werkplek.","Je hebt ook plichten: je moet je werk goed doen, op tijd komen en je aan de regels houden.","Bij problemen op het werk kun je terecht bij de vakbond of het Juridisch Loket."] },
      { w:"Stage & stagiair (internship & intern)", en:"An internship is a period of practical work experience at a company, often as part of your education.", nl:["Een stage is een periode waarin je werkt in een bedrijf om praktijkervaring op te doen.","Een stagiair volgt een stage. Dit is vaak een verplicht onderdeel van de opleiding.","Tijdens een stage leer je hoe het echte werk werkt en bouw je werkervaring op."] },
      { w:"Vrijwilligerswerk (voluntary work)", en:"Voluntary work is unpaid work done for the community or an organisation. It is valued in the Netherlands.", nl:["Vrijwilligerswerk is werk dat je doet zonder betaald te worden.","Je doet vrijwilligerswerk voor de samenleving, zoals in een buurthuis, ziekenhuis of voedselbank.","Vrijwilligerswerk is goed voor jou en voor de samenleving. Het staat ook goed op je CV."] },
      { w:"MAP — Maatschappelijk Activeringsprogramma & participatieverklaring (civic activation programme & declaration)", en:"The MAP helps newcomers prepare for Dutch society and the labour market. The participatieverklaring confirms you accept Dutch values.", nl:["Het MAP is een programma dat nieuwe inwoners helpt om deel te nemen aan de Nederlandse samenleving en de arbeidsmarkt.","In het MAP leer je over werk zoeken, vrijwilligerswerk en hoe de Nederlandse samenleving werkt.","De participatieverklaring is een verklaring die je tekent om te laten zien dat je de waarden van Nederland accepteert."] }
    ]
  },

  // ─── 4. ONDERWIJS & OPVOEDING ───────────────────────────────────────────────
  { id:"onderwijs", emoji:"📚", title:"Onderwijs & Opvoeding", sub:"Education", color:"purple",
    words:[
      { w:"Leerplicht (compulsory education)", en:"Children must attend school from age 5 to 16. Qualified obligation runs to age 18.", nl:["Leerplicht betekent dat kinderen verplicht naar school moeten gaan.","In Nederland zijn kinderen leerplichtig van 5 tot 16 jaar.","Van 16 tot 18 jaar geldt de kwalificatieplicht: jongeren moeten een diploma halen."] },
      { w:"Basisschool & CITO-toets (primary school & CITO test)", en:"Primary school groups 1–8, ages 4–12. CITO-toets at the end determines secondary school advice.", nl:["De basisschool is de eerste school die kinderen bezoeken, van 4 tot 12 jaar.","De basisschool duurt van groep 1 tot groep 8.","Aan het einde van groep 8 doen kinderen de CITO-toets. Die helpt bepalen welk niveau het kind aankan."] },
      { w:"VMBO — Voorbereidend Middelbaar Beroepsonderwijs / HAVO — Hoger Algemeen Voortgezet Onderwijs / VWO — Voorbereidend Wetenschappelijk Onderwijs (secondary school levels)", en:"Three levels of secondary school. Level determines entry to MBO, HBO or university.", nl:["Na de basisschool gaan kinderen naar het voortgezet onderwijs: vmbo, havo of vwo.","Vmbo leidt op voor het mbo. Havo leidt op voor het hbo. Vwo leidt op voor de universiteit.","Welk niveau een kind volgt, hangt af van het advies van de basisschool en de CITO-toets."] },
      { w:"MBO — Middelbaar Beroepsonderwijs (secondary vocational education)", en:"Vocational training levels 1–4. Level 2 is the minimum startkwalificatie for the job market.", nl:["Het mbo is een school waar je een beroep leert, zoals kok, verpleegkundige of elektricien.","Het mbo heeft vier niveaus. Niveau 2 is de minimale startkwalificatie voor de arbeidsmarkt.","Na het mbo kun je gaan werken of doorleren op het hbo."] },
      { w:"HBO — Hoger Beroepsonderwijs & Universiteit (university of applied sciences & university)", en:"HBO is practice-oriented; university is academic. Both award a bachelor's degree.", nl:["Het hbo is hoger onderwijs waar je een praktisch beroep leert, zoals leraar of verpleegkundige.","De universiteit is academisch onderwijs voor wetenschappelijk onderzoek en theorie.","Zowel het hbo als de universiteit geven een bachelordiploma na de opleiding."] },
      { w:"Kinderopvang & BSO — Buitenschoolse Opvang (childcare & after-school care)", en:"Childcare 0–4 years; BSO 4–12 years after school. Partly covered by kinderopvangtoeslag.", nl:["Kinderopvang is opvang voor kinderen van 0 tot 4 jaar terwijl de ouders werken.","BSO — buitenschoolse opvang — is opvang voor kinderen van 4 tot 12 jaar na schooltijd.","Werkende ouders kunnen kinderopvangtoeslag aanvragen om de kosten te betalen."] },
      { w:"DUO — Dienst Uitvoering Onderwijs (Education Executive Agency)", en:"Government agency managing study finance (loans/grants) and the inburgering exam.", nl:["DUO is de overheidsorganisatie die studiefinanciering en onderwijszaken regelt.","Studenten kunnen bij DUO een lening of beurs aanvragen voor hun studie.","DUO beheert ook het inburgeringsexamen voor nieuwe inwoners van Nederland."] },
      { w:"Schoolverzuim (school absenteeism)", en:"Unauthorised school absence. The truancy officer enforces compulsory education law.", nl:["Schoolverzuim betekent dat een kind zonder goede reden niet naar school gaat.","Dit heet ook wel spijbelen. De leerplichtambtenaar controleert het schoolverzuim.","Ouders kunnen een boete krijgen als hun kind te vaak zonder reden wegblijft van school."] },
      { w:"NT2 — Nederlands als Tweede Taal (Dutch as a Second Language)", en:"Dutch as a second language courses, levels A1–C1, for non-native speakers.", nl:["NT2 is een cursus Nederlands voor mensen die de taal niet als moedertaal hebben.","De cursus helpt je om Nederlands te leren spreken, lezen en schrijven.","NT2 heeft niveaus van A1 tot C1."] },
      { w:"BSO — Buitenschoolse Opvang (after-school care)", en:"After-school care for children aged 4–12 years, before and after school hours.", nl:["BSO is opvang voor kinderen van 4 tot 12 jaar buiten schooltijden.","Kinderen gaan naar de BSO na school, soms ook voor school of in de vakantie.","Ouders betalen voor de BSO, maar kunnen kinderopvangtoeslag aanvragen."] },
      { w:"Betrokken ouders (involved parents)", en:"Schools expect parents to be actively involved in their child's education and school life.", nl:["Betrokken ouders volgen de school van hun kind en houden contact met de leerkracht.","Je kunt naar ouderavonden gaan en helpen bij schoolactiviteiten.","Nederlandse scholen vinden het belangrijk dat ouders actief meedoen aan het schoolleven."] },
      { w:"Trakteren (birthday treat)", en:"In the Netherlands, children bring treats to share with the whole class on their birthday.", nl:["Trakteren betekent dat je iets lekkers meeneemt voor de klas, bijvoorbeeld op je verjaardag.","In Nederland is het een traditie dat kinderen hun klasgenoten trakteren op hun verjaardag.","Je kunt kleine koekjes, fruit of ander lekkers meenemen als traktatie."] },
      { w:"Vervolgopleiding (further education / progression)", en:"Education you follow after completing your current level to progress higher.", nl:["Een vervolgopleiding is een opleiding die je doet nadat je een andere opleiding hebt afgerond.","Zo kun je na het mbo doorleren op het hbo of na het havo naar de universiteit gaan.","Met een vervolgopleiding verbeter je je kansen op de arbeidsmarkt."] },
      { w:"Vakantierooster (school holiday schedule)", en:"The school year has fixed holiday periods set by the government. Check your school's schedule.", nl:["Het vakantierooster is een overzicht van alle schoolvakanties in het schooljaar.","Er zijn de zomervakantie, herfstvakantie, kerstvakantie, voorjaarsvakantie en meivakantie.","Je kunt het vakantierooster vinden op de website van de school of de overheid."] },
      { w:"Opvoeding, verantwoordelijkheid & juridische aansprakelijkheid (upbringing, responsibility & legal liability)", en:"Parents are legally responsible for their children's upbringing and behaviour until age 18.", nl:["Opvoeding betekent hoe ouders hun kinderen grootbrengen en leren wat goed en fout is.","Ouders zijn wettelijk verantwoordelijk voor hun kinderen tot 18 jaar.","Als een kind jonger dan 14 jaar schade veroorzaakt, zijn de ouders juridisch aansprakelijk."] },
      { w:"Ouderlijk gezag & voogdij (parental authority & guardianship)", en:"Parents have legal authority over their children until age 18. A guardian takes over if parents cannot care for the child.", nl:["Ouderlijk gezag betekent dat ouders wettelijk het recht en de plicht hebben om voor hun kinderen te zorgen.","Ouders hebben ouderlijk gezag totdat het kind 18 jaar is.","Als ouders niet voor hun kind kunnen zorgen, kan een voogd het gezag overnemen."] }
    ]
  },

  // ─── 5. OVERHEID & RECHTSSTAAT ──────────────────────────────────────────────
  { id:"overheid", emoji:"🏛️", title:"Overheid & Rechtsstaat", sub:"Government & Law", color:"coral",
    words:[
      { w:"DigiD — Digitale Identiteit (Digital Identity)", en:"Digital identity to log in to government services online. Requires a BSN to apply.", nl:["DigiD is jouw digitale identiteit waarmee je kunt inloggen bij de overheid op het internet.","Je hebt DigiD nodig voor overheidswebsites, zoals de Belastingdienst en MijnOverheid.","Je hebt een BSN nodig om DigiD aan te vragen."] },
      { w:"BSN — Burgerservicenummer (citizen service number)", en:"Unique personal number used by all government institutions. Issued on BRP registration.", nl:["Het BSN is een uniek nummer dat iedere inwoner van Nederland heeft.","De overheid gebruikt je BSN om jou te herkennen in alle overheidssystemen.","Je krijgt automatisch een BSN als je je inschrijft bij de gemeente in de BRP."] },
      { w:"Gemeente & burgemeester (municipality & mayor)", en:"Local government. An appointed mayor leads the executive. Elected gemeenteraad makes local rules.", nl:["De gemeente is de lokale overheid die regels maakt voor jouw stad of dorp.","De burgemeester leidt de gemeente. Hij of zij wordt benoemd, niet gekozen door de inwoners.","De gemeenteraad wordt wel gekozen door de inwoners bij de gemeenteraadsverkiezingen."] },
      { w:"Rechtsstaat (constitutional state / rule of law)", en:"Everyone including the government must obey the law. Rights are protected by the Grondwet.", nl:["In een rechtsstaat heeft iedereen rechten en moet iedereen zich aan de wet houden.","Ook de overheid zelf moet zich aan de wet houden in een rechtsstaat.","Grondrechten, zoals vrijheid van meningsuiting, zijn beschermd in de Grondwet."] },
      { w:"Tweede Kamer (House of Representatives)", en:"150 directly elected members who debate and vote on laws. Meets in Den Haag.", nl:["De Tweede Kamer is het belangrijkste deel van het parlement in Nederland.","De Tweede Kamer heeft 150 gekozen leden die wetten bespreken en goedkeuren.","De Tweede Kamer vergadert in Den Haag."] },
      { w:"Democratie & stemmen (democracy & voting)", en:"Parliamentary democracy. Citizens vote every four years for the Tweede Kamer, from age 18.", nl:["Nederland is een democratie: de bevolking kiest haar eigen vertegenwoordigers.","Burgers kiezen de Tweede Kamer elke vier jaar bij verkiezingen.","Je moet 18 jaar of ouder zijn om te mogen stemmen in Nederland."] },
      { w:"Grondwet (Constitution)", en:"The highest law in the Netherlands. Protects free speech, equality and other fundamental rights.", nl:["De Grondwet is de belangrijkste en hoogste wet van Nederland.","Alle andere wetten moeten passen binnen de Grondwet.","De Grondwet beschermt rechten zoals gelijkheid, vrijheid van meningsuiting en godsdienstvrijheid."] },
      { w:"Kabinet & minister-president (Cabinet & Prime Minister)", en:"Cabinet formed by prime minister and ministers after elections. Accountable to parliament.", nl:["Het kabinet is de groep van ministers die samen de Nederlandse regering vormen.","De minister-president is de leider van het kabinet en de baas van de regering.","Het kabinet voert het beleid uit en legt verantwoording af aan de Tweede Kamer."] },
      { w:"Politie (Police)", en:"National police force divided into regional units. 112 for emergencies, 0900-8844 for non-urgent.", nl:["De politie zorgt voor de veiligheid en openbare orde in Nederland.","Er is één nationale politie in Nederland, verdeeld in regionale eenheden.","Bel 112 bij spoed. Bel 0900-8844 voor niet-spoedeisende vragen."] },
      { w:"Waterschap (water board)", en:"Water boards manage water levels, dikes and water quality in their region.", nl:["Een waterschap is een overheidsorganisatie die het water in een regio beheert.","Het waterschap zorgt voor de dijken, het waterpeil en de kwaliteit van het water.","Nederland heeft 21 waterschappen. Je kunt ook stemmen bij verkiezingen voor het waterschap."] },
      { w:"Actief & passief kiesrecht — stemmen (active & passive voting rights)", en:"Active voting right = right to vote. Passive voting right = right to stand as a candidate.", nl:["Kiesrecht is het recht om mee te doen aan verkiezingen.","Actief kiesrecht betekent dat je mag stemmen. Passief kiesrecht betekent dat je jezelf kandidaat mag stellen.","In Nederland heb je actief kiesrecht vanaf 18 jaar."] },
      { w:"Eerste Kamer — Senaat (Senate)", en:"The Senate has 75 members elected by provincial councils. It reviews laws passed by the Tweede Kamer.", nl:["De Eerste Kamer is een onderdeel van het parlement, naast de Tweede Kamer.","De Eerste Kamer heeft 75 leden die worden gekozen door de Provinciale Staten.","De Eerste Kamer controleert wetten die de Tweede Kamer heeft goedgekeurd."] },
      { w:"Minister-president (Prime Minister)", en:"The Prime Minister leads the cabinet and represents the Netherlands at home and internationally.", nl:["De minister-president is de leider van de Nederlandse regering.","Hij of zij leidt de vergaderingen van het kabinet en neemt de meeste beslissingen.","De minister-president vertegenwoordigt Nederland bij internationale vergaderingen."] },
      { w:"Parlement — Eerste Kamer & Tweede Kamer (Parliament)", en:"The Dutch parliament consists of two chambers: the Tweede Kamer and the Eerste Kamer.", nl:["Het parlement bestaat uit twee kamers: de Eerste Kamer en de Tweede Kamer.","Het parlement maakt de wetten van Nederland en controleert de regering.","Het parlement vergadert in Den Haag."] },
      { w:"Taken van de koning in de regering (role of the king in government)", en:"The king signs new laws, opens parliament, and reads the Troonrede each September on Prinsjesdag.", nl:["De koning heeft een speciale rol in de regering, maar heeft geen politieke macht.","De koning tekent nieuwe wetten en opent elk jaar het parlement op Prinsjesdag.","Op Prinsjesdag leest de koning de Troonrede voor met de plannen van de regering voor het nieuwe jaar."] },
      { w:"Koningsdag & Wilhelmus — het volkslied (King's Day & the national anthem)", en:"Koningsdag is 27 April. The Wilhelmus is the national anthem, named after Willem van Oranje.", nl:["Koningsdag is op 27 april. Dan viert heel Nederland de verjaardag van de koning.","Het Wilhelmus is het Nederlandse volkslied. Het wordt gezongen bij officiële gelegenheden.","Het Wilhelmus is geschreven over Willem van Oranje, de 'Vader des Vaderlands'."] },
      { w:"Machtenscheiding (separation of powers)", en:"Power is divided between legislature (parliament), executive (government) and judiciary (courts).", nl:["Machtenscheiding betekent dat de macht in Nederland is verdeeld over drie groepen.","De wetgevende macht maakt wetten. De uitvoerende macht voert ze uit. De rechterlijke macht controleert de regels.","Machtenscheiding zorgt ervoor dat niemand te veel macht heeft."] },
      { w:"Orgaandonatie & Donorregister (organ donation & donor register)", en:"Every adult resident in the Netherlands is registered in the national donor register. You choose your preference.", nl:["Orgaandonatie betekent dat je na jouw dood jouw organen geeft aan iemand anders die ze nodig heeft.","In Nederland staat elke volwassen inwoner automatisch geregistreerd in het Donorregister.","Je kunt zelf kiezen of je donor wilt zijn, niet donor, of dat je nabestaanden de keuze mogen maken."] },
      { w:"Wet staat boven religie en traditie (law above religion and tradition)", en:"In the Netherlands, state law always takes precedence over religious rules or cultural traditions.", nl:["In Nederland staat de wet altijd boven religieuze regels of culturele tradities.","Dit betekent dat religieuze of culturele gebruiken die tegen de wet ingaan, niet zijn toegestaan.","Dit is een belangrijk principe van de rechtsstaat en de democratie."] },
      { w:"Coalitievorming & formateur (coalition formation & formateur)", en:"After elections, parties negotiate to form a governing coalition. A formateur guides the negotiations.", nl:["Na de verkiezingen gaan partijen samenwerken om een coalitie te vormen die genoeg steun heeft in de Tweede Kamer.","Een formateur begeleidt de onderhandelingen tussen de partijen.","De coalitie schrijft een coalitieakkoord: een plan met de plannen van de regering voor de komende jaren."] },
      { w:"MijnOverheid & digitale overheid (My Government portal & digital government)", en:"MijnOverheid is the personal online portal where you can view government messages and your personal data.", nl:["MijnOverheid is een persoonlijk online portaal van de Nederlandse overheid.","Via MijnOverheid kun je berichten van overheidsorganisaties inzien en je persoonlijke gegevens bekijken.","Je logt in op MijnOverheid met je DigiD."] }
    ]
  },

  { id:"instanties", emoji:"📋", title:"Instanties", sub:"Public Institutions", color:"green",

      { w:"Maatschappelijk werk (social work)", en:"Social workers help with personal, financial or social problems. Free and confidential.", nl:["Maatschappelijk werk helpt mensen met persoonlijke, sociale of financiële problemen.","De maatschappelijk werker luistert naar je problemen en helpt je een oplossing te vinden.","Maatschappelijk werk is gratis en vertrouwelijk."] },
      { w:"Schuldhulpverlening (debt assistance)", en:"Municipality helps create a repayment plan and negotiate with creditors when debts become unmanageable.", nl:["Schuldhulpverlening is hulp voor mensen die veel schulden hebben en ze niet meer kunnen betalen.","De gemeente helpt je een betalingsregeling te maken met de schuldeisers.","Je vraagt schuldhulpverlening aan bij de gemeente."] },
      { w:"SVB — Sociale Verzekeringsbank (Social Insurance Bank)", en:"Social insurance bank paying out AOW, kinderbijslag and other social insurance.", nl:["De SVB is een overheidsorganisatie die sociale verzekeringen uitbetaalt.","De SVB betaalt de AOW — Algemene Ouderdomswet — voor ouderen van 67 jaar en ouder.","Als je een kind krijgt, vraag je kinderbijslag aan bij de SVB."] },
      { w:"WMO — Wet Maatschappelijke Ondersteuning (Social Support Act)", en:"Provides home help and support for elderly or disabled people who cannot manage independently.", nl:["De WMO is een wet die mensen helpt die niet goed zelfstandig kunnen wonen of leven.","Via de WMO kun je hulp krijgen bij het huishouden, vervoer of wonen.","Je vraagt WMO-hulp aan bij de gemeente."] },
      { w:"GGD — Gemeentelijke Gezondheidsdienst (Municipal Health Service)", en:"Public health service organising vaccinations, youth healthcare and infection control.", nl:["De GGD is de gemeentelijke gezondheidsdienst die de volksgezondheid beschermt.","De GGD organiseert vaccinaties en jeugdgezondheidszorg voor kinderen.","Ouders gaan met jonge kinderen naar het consultatiebureau van de GGD."] },
      { w:"KvK — Kamer van Koophandel (Chamber of Commerce)", en:"All businesses and ZZP'ers must register here. Provides a unique company number.", nl:["De KvK is de organisatie waar alle bedrijven in Nederland zich moeten inschrijven.","Als je een eigen bedrijf start of als ZZP'er werkt, schrijf je je in bij de KvK.","De KvK geeft je een uniek KvK-nummer dat je gebruikt bij zakelijke transacties."] },
      { w:"Notaris (notary)", en:"Required for legal documents such as buying a house, making a will or setting up a company.", nl:["Een notaris is een jurist die officiële documenten opstelt en controleert.","Je hebt een notaris nodig bij het kopen van een huis, het maken van een testament of het starten van een bedrijf.","De notaris zorgt ervoor dat alles wettelijk in orde is."] },
      { w:"Belastingdienst Toeslagen / Dienst Toeslagen (Tax Authority Benefits)", en:"Manages all four allowances: zorgtoeslag, huurtoeslag, kinderopvangtoeslag and kindgebonden budget.", nl:["Dienst Toeslagen is een onderdeel van de Belastingdienst dat toeslagen uitbetaalt.","Er zijn vier toeslagen: zorgtoeslag, huurtoeslag, kinderopvangtoeslag en kindgebonden budget.","Je vraagt toeslagen aan via DigiD op de website van de Belastingdienst."] },
      { w:"Taken van de gemeente (tasks of the municipality)", en:"The municipality handles local services: housing registration, permits, social assistance, waste collection and more.", nl:["De gemeente regelt veel zaken voor de inwoners in een stad of dorp.","De gemeente geeft vergunningen, haalt afval op, geeft bijstand en regelt de BRP — Basisregistratie Personen.","Als je een vraag hebt over lokale zaken, ga je naar het gemeentehuis of de website van de gemeente."] },
      { w:"AOW — Algemene Ouderdomswet & SVB — Sociale Verzekeringsbank (State Old Age Pension & Social Insurance Bank)", en:"The AOW is the state pension paid by the SVB from age 67 to everyone who has lived or worked in the Netherlands.", nl:["De AOW is een pensioen van de overheid voor mensen die 67 jaar of ouder zijn.","De SVB — Sociale Verzekeringsbank — betaalt de AOW elke maand uit.","Je ontvangt AOW als je in Nederland hebt gewoond of gewerkt."] },
      { w:"Verblijfsvergunning (residence permit)", en:"A residence permit gives non-EU citizens the right to live and stay in the Netherlands.", nl:["Een verblijfsvergunning is een officieel document dat je het recht geeft om in Nederland te wonen.","Mensen van buiten de EU hebben een verblijfsvergunning nodig om in Nederland te blijven.","Je vraagt een verblijfsvergunning aan bij de IND — Immigratie- en Naturalisatiedienst."] },
      { w:"Taken van de politie (tasks of the police)", en:"The police maintain public safety, investigate crimes and help people in emergencies.", nl:["De politie zorgt voor de veiligheid van mensen in Nederland.","De politie doet onderzoek naar misdrijven en helpt mensen in noodsituaties.","Je kunt de politie bellen op 112 bij spoed, of op 0900-8844 voor andere vragen."] },
      { w:"Belastingaangifte & inkomstenbelasting (tax return & income tax)", en:"You file a tax return once a year via DigiD. The Belastingdienst calculates how much tax you owe.", nl:["Belasting betalen is verplicht voor iedereen die in Nederland werkt of woont.","Je doet belastingaangifte om te laten zien hoeveel je hebt verdiend. Dat heet inkomstenbelasting.","Je doet aangifte via DigiD op de website van de Belastingdienst, meestal voor 1 mei."] },
      { w:"Privacy & persoonsgegevens & AVG — Algemene Verordening Gegevensbescherming (privacy, personal data & GDPR)", en:"Your personal data is protected by Dutch and European law. Organisations must handle it carefully and tell you why they use it.", nl:["Privacy betekent dat jij het recht hebt om te bepalen wie jouw persoonlijke gegevens mag gebruiken.","De AVG — Algemene Verordening Gegevensbescherming — beschermt jouw persoonsgegevens in heel Europa.","Organisaties moeten jou altijd vertellen waarom ze jouw gegevens gebruiken en hoe ze die bewaren."] },
      { w:"RDW — Rijksdienst voor het Wegverkeer (Vehicle Authority)", en:"The RDW registers all vehicles and driving licences in the Netherlands. You need a RDW registration to drive legally.", nl:["De RDW is de overheidsorganisatie die alle voertuigen en rijbewijzen in Nederland registreert.","Bij de RDW schrijf je een auto of motor in. Je kenteken is geregistreerd bij de RDW.","Als je in Nederland een voertuig wilt rijden, moet het geregistreerd zijn bij de RDW."] },
      { w:"IND — Immigratie- en Naturalisatiedienst (Immigration and Naturalisation Service)", en:"The IND processes residence permits, asylum requests and naturalisation (becoming a Dutch citizen).", nl:["De IND is de overheidsorganisatie die aanvragen voor verblijfsvergunningen en naturalisatie beoordeelt.","Als je in Nederland wilt blijven, vraag je een verblijfsvergunning aan bij de IND.","Naturalisatie betekent dat je de Nederlandse nationaliteit aanvraagt. Dit doe je ook bij de IND."] }
    ]
  },

  { id:"geschiedenis", emoji:"📜", title:"Geschiedenis & Geografie", sub:"History & Geography", color:"gray",

      { w:"12 Provincies (12 provinces)", en:"The Netherlands has 12 provinces each with a capital and provincial government.", nl:["Nederland is verdeeld in 12 provincies, elk met een eigen hoofdstad.","Elke provincie heeft een eigen bestuur: de Provinciale Staten en de Gedeputeerde Staten.","Bekende provincies zijn Noord-Holland, Zuid-Holland en Utrecht."] },
      { w:"Amsterdam & Den Haag (Amsterdam & The Hague)", en:"Amsterdam is the constitutional capital. Den Haag is the seat of government, parliament and the king.", nl:["Amsterdam is de hoofdstad van Nederland.","Den Haag is de stad waar de overheid, het parlement en de ministeries zitten.","De koning woont ook in Den Haag."] },
      { w:"OV — Openbaar Vervoer & OV-chipkaart (Public Transport & OV-chip card)", en:"Public transport includes train, tram, bus and metro. Pay with OV-chipkaart, always check in and out.", nl:["Het OV — openbaar vervoer — bestaat uit trein, tram, bus en metro.","Je betaalt in het OV met de OV-chipkaart. Je moet altijd in- en uitchecken.","Als je niet uitcheckt, betaal je meer. Vergeet het uitchecken niet!"] },

      { w:"Deltawerken (Delta Works)", en:"System of dams and storm surge barriers built after 1953. Oosterscheldekering is world's largest.", nl:["De Deltawerken zijn een groot systeem van dijken, dammen en stormvloedkeringen.","Ze zijn gebouwd na de Watersnoodramp van 1953 om Nederland te beschermen tegen het water.","De Oosterscheldekering is een van de zeven moderne wereldwonderen."] },
      { w:"Polders & dijken (polders & dikes)", en:"Land reclaimed from water kept dry by pumping. A third of Netherlands is below sea level.", nl:["Een polder is een stuk land dat vroeger onder water stond maar nu droog is.","Dijken en pompen houden het water buiten de polders.","Een derde van Nederland ligt onder de zeespiegel."] },
      { w:"Afsluitdijk (Afsluitdijk dam)", en:"32km dam built 1927–1932 separating IJsselmeer from Waddenzee, enabling the Flevopolders.", nl:["De Afsluitdijk is een grote dam van 32 kilometer lang.","Hij sluit het IJsselmeer af van de Waddenzee. Hij is gebouwd tussen 1927 en 1932.","Na de bouw van de Afsluitdijk werden de Flevopolders drooggelegd."] },
      { w:"Gouden Eeuw (17e eeuw) — Golden Age (17th century)", en:"17th century Dutch Golden Age: world trading power, richest city in the world, Rembrandt, Vermeer.", nl:["De Gouden Eeuw was de 17e eeuw, toen Nederland een van de rijkste landen ter wereld was.","Nederland had een grote handelsvloot en handelde met landen over de hele wereld.","Rembrandt en Vermeer waren beroemde schilders uit de Gouden Eeuw."] },
      { w:"VOC — Vereenigde Oostindische Compagnie (Dutch East India Company)", en:"World's first multinational company (1602–1799) trading with Asia, especially Indonesia.", nl:["De VOC was een grote handelsonderneming die handelde met Azië.","De VOC bestond van 1602 tot 1799 en was de eerste multinationale onderneming ter wereld.","De VOC handelde vooral met Indonesië en bracht specerijen naar Europa."] },
      { w:"Slavernij & Driehoekshandel (slavery & triangular trade)", en:"Netherlands deeply involved in transatlantic slave trade. Ships traded goods, enslaved people and colonial products.", nl:["Nederland was betrokken bij de handel in tot slaaf gemaakten.","De driehoekshandel verbond Europa, West-Afrika en Amerika met handelsgoederen en mensen.","Nederland had plantages in Suriname en andere kolonies waar tot slaaf gemaakten werkten."] },
      { w:"Tweede Wereldoorlog (World War II)", en:"Germany occupied Netherlands 1940–1945. Over 100,000 Dutch Jews murdered. Anne Frank hid in Amsterdam.", nl:["Van 1940 tot 1945 was Nederland bezet door nazi-Duitsland.","In die tijd werden meer dan 100.000 Joodse Nederlanders vermoord.","Anne Frank, een joods meisje, verstopte zich in Amsterdam. Haar dagboek is wereldberoemd."] },
      { w:"Dodenherdenking & Bevrijdingsdag (Remembrance Day & Liberation Day)", en:"4 May: two-minute silence at 8pm for war victims. 5 May: Liberation Day, end of occupation.", nl:["Op 4 mei herdenkt Nederland de mensen die gestorven zijn in oorlogen.","Om 20:00 uur is er twee minuten stilte voor de oorlogsslachtoffers.","Op 5 mei viert Nederland de bevrijding van 1945."] },
      { w:"VN — Verenigde Naties, NAVO — Noord-Atlantische Verdragsorganisatie & EU — Europese Unie (UN, NATO & EU)", en:"VN (1945) for peace. NAVO (1949) military alliance, founding member. EU: 27 countries, free movement.", nl:["De VN — Verenigde Naties — is een internationale organisatie voor vrede en mensenrechten.","De NAVO — Noord-Atlantische Verdragsorganisatie — is een militair bondgenootschap. Nederland is een oprichter.","De EU — Europese Unie — heeft 27 landen. Burgers mogen vrij wonen en werken in alle EU-landen."] },
      { w:"Arbeidsmigranten & gastarbeiders (migrant workers & guest workers)", en:"From 1960s, Dutch government recruited workers from Turkey and Morocco. Many stayed permanently.", nl:["In de jaren 60 kwamen mensen uit Turkije en Marokko naar Nederland om te werken.","De overheid vroeg hen te komen omdat er een tekort was aan arbeidskrachten.","Veel gastarbeiders bleven permanent in Nederland en brachten hun gezin over."] },
      { w:"Willem van Oranje (William of Orange)", en:"Led Dutch revolt against Spain in the 16th century. Called 'Father of the Fatherland'. Wilhelmus named after him.", nl:["Willem van Oranje was een leider in de 16e eeuw die vocht voor de vrijheid van Nederland.","Hij leidde de opstand tegen het Spaanse bewind. Daarom heet hij de 'Vader des Vaderlands'.","Het Wilhelmus, het Nederlandse volkslied, is over hem geschreven."] },
      { w:"Dekolonisatie (decolonisation)", en:"Indonesia independent 1945 (recognised 1949). Suriname independent 1975. Both major chapters in Dutch history.", nl:["Dekolonisatie betekent dat vroegere kolonies onafhankelijk werden.","Indonesië werd onafhankelijk in 1945. Nederland erkende dat in 1949.","Suriname werd onafhankelijk in 1975. Veel Surinamers kwamen daarna naar Nederland."] },
      { w:"Holocaust & antisemitisme (the Holocaust & antisemitism)", en:"The Holocaust was the systematic murder of 6 million Jews by the Nazis. Antisemitism means hatred of Jewish people and is forbidden.", nl:["De Holocaust was de systematische moord op zes miljoen Joodse mensen door de nazi's tijdens de Tweede Wereldoorlog.","In Nederland werden meer dan 100.000 Joodse Nederlanders vermoord. Dit is een van de donkerste bladzijdes van de Nederlandse geschiedenis.","Antisemitisme is haat of discriminatie van Joodse mensen. Dit is verboden in Nederland."] },
      { w:"Nederlandse feestdagen & tradities (Dutch public holidays & traditions)", en:"National holidays include Koningsdag, Bevrijdingsdag and Christmas. Sinterklaas on 5 December is a beloved Dutch children's tradition.", nl:["Nederland heeft officiële feestdagen, zoals Koningsdag, Bevrijdingsdag, Kerstmis en Pasen.","Sinterklaas is op 5 december. Dit is een traditioneel kinderfeest waarbij cadeaus worden gegeven.","Op officiële feestdagen zijn scholen en veel winkels gesloten."] }
    ]
  },

  // ─── 8. OMGANGSVORMEN, NORMEN & WAARDEN ─────────────────────────────────────

    words:[
      { w:"Directheid (directness)", en:"Dutch people say what they think directly. This is a cultural norm of honesty, not rudeness.", nl:["Directheid betekent dat je eerlijk zegt wat je denkt, zonder omwegen.","Nederlanders zijn bekend om hun directheid. Ze zeggen wat ze bedoelen.","In andere culturen kan directheid soms onbeleefd lijken, maar in Nederland is het normaal."] },
      { w:"Op tijd komen (punctuality)", en:"Punctuality is very important for appointments and meetings. Call if you are late.", nl:["Op tijd zijn betekent dat je op het afgesproken tijdstip aankomt.","In Nederland is het heel belangrijk om op tijd te komen voor afspraken.","Als je te laat bent, bel of app je van tevoren om het te laten weten."] },
      { w:"Zelfbeschikking (self-determination)", en:"Everyone may make their own choices about body, relationships and lifestyle. Forced marriages are illegal.", nl:["Zelfbeschikking betekent dat iedereen zelf mag beslissen over zijn eigen leven en lichaam.","In Nederland heb je het recht om zelf te kiezen met wie je trouwt, hoe je leeft en wat je gelooft.","Gedwongen huwelijken zijn verboden in Nederland."] },
      { w:"Tolerantie & diversiteit (tolerance & diversity)", en:"Known as a tolerant society. Different religions, views and lifestyles are accepted, but law must be respected.", nl:["Tolerantie betekent dat je andere mensen accepteert, ook als ze anders zijn dan jij.","Nederland staat bekend als een tolerant land. Mensen mogen een andere religie of leefstijl hebben.","Tolerantie betekent niet dat alles mag. Je moet altijd de wet respecteren."] },
      { w:"Gelijkheid & non-discriminatie (equality & non-discrimination)", en:"Article 1 of the Grondwet: everyone must be treated equally. Discrimination is prohibited.", nl:["Gelijkheid betekent dat alle mensen dezelfde rechten en kansen hebben.","Artikel 1 van de Grondwet zegt dat iedereen gelijk behandeld moet worden.","Discriminatie is verboden, ook op basis van religie, ras, geslacht of seksuele gerichtheid."] },
      { w:"Vrijheid van meningsuiting (freedom of expression)", en:"Everyone may express opinions freely. Hate speech and incitement to violence are illegal.", nl:["Vrijheid van meningsuiting betekent dat je jouw mening vrij mag zeggen.","Dit recht staat in de Grondwet. Je mag ook een onpopulaire mening hebben.","Uitingen die aanzetten tot haat of geweld zijn verboden."] },
      { w:"Godsdienstvrijheid (freedom of religion)", en:"Everyone may practise any religion or none. The state is neutral with no official religion.", nl:["Godsdienstvrijheid betekent dat iedereen zelf mag kiezen welk geloof hij of zij heeft.","In Nederland mag je elk geloof belijden of helemaal geen religie hebben.","De overheid is neutraal. Er is geen officiële staatsgodsdienst in Nederland."] },
      { w:"Huiselijk geweld & Veilig Thuis (domestic violence & Safe Home)", en:"Domestic violence is a serious crime. Report anonymously to Veilig Thuis for advice and help.", nl:["Huiselijk geweld is geweld dat gebeurt binnen een gezin of relatie.","Dit is strafbaar in Nederland. Je kunt het melden bij Veilig Thuis.","Je kunt Veilig Thuis anoniem bellen als je slachtoffer bent of je zorgen maakt om iemand."] },
      { w:"Koningsdag & Wilhelmus — het volkslied (King's Day & national anthem)", en:"Koningsdag is 27 April — nationwide celebration. Wilhelmus is the national anthem.", nl:["Koningsdag is op 27 april. Dan viert heel Nederland de verjaardag van de koning.","Op Koningsdag zijn er oranjefeesten en vrijmarkten door het hele land.","Het Wilhelmus is het Nederlandse volkslied. Het wordt gezongen bij officiële gelegenheden."] },
      { w:"Poldermodel & overlegcultuur (polder model & consultation culture)", en:"Dutch consensus culture: decisions made through consultation and compromise rather than confrontation.", nl:["Het poldermodel betekent dat mensen samenwerken en compromissen sluiten.","Nederlanders overleggen veel voordat ze een beslissing nemen.","Het doel is een oplossing te vinden waar iedereen mee kan leven."] },
      { w:"Diversiteit & inclusie (diversity & inclusion)", en:"The Netherlands is a diverse country. Everyone has equal rights regardless of background, religion or culture.", nl:["Diversiteit betekent dat mensen verschillend zijn: in afkomst, religie, cultuur of achtergrond.","Inclusie betekent dat iedereen meedoet en geaccepteerd wordt in de samenleving.","In Nederland is discriminatie verboden. Iedereen heeft recht op gelijke behandeling."] },
      { w:"Online veiligheid & cyberpesten (online safety & cyberbullying)", en:"Online safety means protecting your personal data online. Cyberbullying via the internet is not allowed and can be criminal.", nl:["Online veiligheid betekent dat je voorzichtig bent met jouw persoonlijke informatie op het internet.","Deel nooit jouw wachtwoord, BSN of bankgegevens online met mensen die je niet vertrouwt.","Cyberpesten is pesten via internet of sociale media. Dit is strafbaar als het ernstig is."] },
      { w:"Vrijwilligerswerk als norm (voluntary work as a social norm)", en:"Volunteering is an important part of Dutch society. Many organisations depend on volunteers.", nl:["Vrijwilligerswerk is onbetaald werk dat je doet voor de samenleving of een organisatie.","In Nederland doen veel mensen vrijwilligerswerk, bijvoorbeeld bij een sportclub of voedselbank.","Vrijwilligerswerk is belangrijk voor de samenleving. Het laat zien dat je bijdraagt aan de gemeenschap."] }
    ]
  }

// ─── SAVED WORDS ──────────────────────────────────────────────────────────────
var savedWords = JSON.parse(localStorage.getItem('knm_saved') || '[]');

function isSaved(topicId, wordIdx) {
  return savedWords.some(function(s) { return s.topicId === topicId && s.wordIdx === wordIdx; });
}

function toggleSaveWord(topicId, wordIdx, btnEl) {
  if (isSaved(topicId, wordIdx)) {
    savedWords = savedWords.filter(function(s) { return !(s.topicId === topicId && s.wordIdx === wordIdx); });
  } else {
    savedWords.push({ topicId: topicId, wordIdx: wordIdx });
  }
  localStorage.setItem('knm_saved', JSON.stringify(savedWords));
  updateSavedCount();
  if (btnEl) btnEl.classList.toggle('saved', isSaved(topicId, wordIdx));
  if (document.getElementById('savedPanel').style.display !== 'none') renderSavedPanel();
}

function updateSavedCount() {
  var el = document.getElementById('savedCount');
  if (el) el.textContent = savedWords.length > 0 ? '(' + savedWords.length + ')' : '';
  var btn = document.getElementById('savedBtn');
  if (btn) btn.classList.toggle('active', savedWords.length > 0);
}

var savedPanelOpen = false;

function toggleSaved() {
  savedPanelOpen = !savedPanelOpen;
  var panel = document.getElementById('savedPanel');
  var content = document.getElementById('content');
  if (savedPanelOpen) {
    panel.style.display = 'block';
    content.style.display = 'none';
    document.getElementById('searchResults').style.display = 'none';
    renderSavedPanel();
  } else {
    panel.style.display = 'none';
    content.style.display = 'block';
  }
}

function renderSavedPanel() {
  var panel = document.getElementById('savedPanel');
  if (!savedWords.length) {
    panel.innerHTML = '<div class="saved-empty">🔖 Geen opgeslagen woorden.<br>Klik op het 🔖-icoon op een woordkaart om hem op te slaan.</div>';
    return;
  }
  var grouped = {};
  savedWords.forEach(function(s) {
    if (!grouped[s.topicId]) grouped[s.topicId] = [];
    grouped[s.topicId].push(s.wordIdx);
  });
  var html = '<div class="saved-panel-header"><h3>🔖 Opgeslagen woorden</h3>';
  html += '<button class="clear-saved-btn" onclick="clearAllSaved()">Alles verwijderen</button></div>';
  topics.forEach(function(t) {
    if (!grouped[t.id]) return;
    var c = colorMap[t.color];
    html += '<div style="margin-bottom:20px;">';
    html += '<span class="saved-category-label" style="background:'+c.bg+';color:'+c.text+'">'+t.emoji+' '+t.title+'</span>';
    grouped[t.id].forEach(function(wi) {
      var entry = t.words[wi];
      if (!entry) return;
      var dutchTitle = entry.w.replace(/\s*\([^)]*\)\s*$/, '').trim();
      var safeDutchTitle = dutchTitle.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html += '<div class="word-card" style="margin-bottom:8px;">';
      html += '<div class="word-title-row">';
      html += '<button class="save-word-btn saved" onclick="toggleSaveWord(\''+t.id+'\','+wi+',this)" title="Verwijder uit opgeslagen">🔖</button>';
      html += '<p class="word-title">'+entry.w+'</p>';
      html += '<button class="speak-btn speak-title" onclick="speakDutch(\''+safeDutchTitle+'\',this)">🔊</button>';
      html += '</div><ul class="word-body">';

// ─── TTS ─────────────────────────────────────────────────────────────────────
var currentUtterance = null;

function speakDutch(text, btnEl) {
  if (!('speechSynthesis' in window)) { alert('Spraak niet beschikbaar in deze browser.'); return; }
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.speaking').forEach(function(b){ b.classList.remove('speaking'); });
  if (currentUtterance && currentUtterance._text === text) { currentUtterance = null; return; }
  var utt = new SpeechSynthesisUtterance(text);
  utt._text = text;
  utt.lang = 'nl-NL';
  utt.rate = 0.76;
  utt.pitch = 1;
  if (btnEl) btnEl.classList.add('speaking');
  utt.onend = function() { if (btnEl) btnEl.classList.remove('speaking'); currentUtterance = null; };
  utt.onerror = function() { if (btnEl) btnEl.classList.remove('speaking'); currentUtterance = null; };
  currentUtterance = utt;
  window.speechSynthesis.speak(utt);
}

// ─── PER-SENTENCE ON-DEMAND TRANSLATION ──────────────────────────────────────
async function toggleTranslation(key, btnEl) {
  var enDiv = document.getElementById('en-' + key);
  var state = sentenceTranslations[key];

  // Already fetched — just toggle visibility
  if (state) {
    state.visible = !state.visible;
    if (enDiv) enDiv.style.display = state.visible ? 'block' : 'none';
    btnEl.classList.toggle('active', state.visible);
    return;
  }

  // Look up in prebuilt translations first (instant, no API)
  var translation = '';
  if (key.startsWith('ex-')) {
    var exKey = key.replace('ex-', '');
    translation = (typeof exampleTranslations !== 'undefined') ? (exampleTranslations[exKey] || '') : '';
  } else {
    translation = (typeof prebuiltTranslations !== 'undefined') ? (prebuiltTranslations[key] || '') : '';
  }

  // Fallback to word's English description if no prebuilt found
  if (!translation) {
    var info = sentenceMap[key];
    translation = info ? info.en : '';
  }

  sentenceTranslations[key] = { text: translation, visible: true };
  if (enDiv) { enDiv.textContent = '🇬🇧 ' + translation; enDiv.style.display = 'block'; }
  btnEl.classList.add('active');
}

// ─── SHUFFLE ──────────────────────────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var examQuestions = [];
