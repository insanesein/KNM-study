var sentenceTranslations = {}; // key -> { text, visible }
var pendingTranslations = {};  // key -> true (loading in progress)
var sentenceMap = {};          // key -> { nl: "Dutch", en: "English fallback" }

// ─── TTS ─────────────────────────────────────────────────────────────────────
var currentUtterance = null;

function speakDutch(text, btnEl) {
  if (!('speechSynthesis' in window)) { alert('Spraak niet beschikbaar in deze browser.'); return; }
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.speaking').forEach(function(b){ b.classList.remove('speaking'); });
  if (currentUtterance && currentUtterance._text === text) { currentUtterance = null; return; }
  var utt = new SpeechSynthesisUtterance(text);
  utt._text = text;
  utt.lang = 'nl-NL';
  utt.rate = 0.76;
  utt.pitch = 1;
  if (btnEl) btnEl.classList.add('speaking');
  utt.onend = function() { if (btnEl) btnEl.classList.remove('speaking'); currentUtterance = null; };
  utt.onerror = function() { if (btnEl) btnEl.classList.remove('speaking'); currentUtterance = null; };
  currentUtterance = utt;
  window.speechSynthesis.speak(utt);
}

// ─── PER-SENTENCE ON-DEMAND TRANSLATION ──────────────────────────────────────
async function toggleTranslation(key, btnEl) {
  var enDiv = document.getElementById('en-' + key);
  var state = sentenceTranslations[key];

  // Already fetched — just toggle visibility
  if (state) {
    state.visible = !state.visible;
    if (enDiv) enDiv.style.display = state.visible ? 'block' : 'none';
    btnEl.classList.toggle('active', state.visible);
    return;
  }

  // Look up in prebuilt translations first (instant, no API)
  var translation = '';
  if (key.startsWith('ex-')) {
    var exKey = key.replace('ex-', '');
    translation = (typeof exampleTranslations !== 'undefined') ? (exampleTranslations[exKey] || '') : '';
  } else {
    translation = (typeof prebuiltTranslations !== 'undefined') ? (prebuiltTranslations[key] || '') : '';
  }

  // Fallback to word's English description if no prebuilt found
  if (!translation) {
    var info = sentenceMap[key];
    translation = info ? info.en : '';
  }

  sentenceTranslations[key] = { text: translation, visible: true };
  if (enDiv) { enDiv.textContent = '🇬🇧 ' + translation; enDiv.style.display = 'block'; }
  btnEl.classList.add('active');
}

      html += '<p class="word-title">'+w.w.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</p>';
      html += '<button class="speak-btn speak-title" onclick="speakDutch(\''+safeDutchTitle+'\',this)" title="Hoor uitspraak begrip">🔊</button>';
      html += '</div>';
      html += '<ul class="word-body">';
      w.nl.forEach(function(line, li) {
        var key = t.id + '-' + origIdx + '-' + li;
        sentenceMap[key] = { nl: line, en: w.en };

        var hi = line.replace(new RegExp('('+searchQuery.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark style="background:#ffe066;border-radius:2px;">$1</mark>');
        var st = sentenceTranslations[key];
        html += '<li><div class="sentence-row"><span class="nl-text">'+hi+'</span>';
        html += '<button class="speak-btn" onclick="speakDutch(\''+safe+'\',this)" title="Luister">🔊</button>';
        html += '<button class="translate-btn'+(st&&st.visible?' active':'')+'" id="tbtn-'+key+'" onclick="toggleTranslation(\''+key+'\',this)" title="Toon vertaling">🇬🇧</button>';
        html += '</div>';
        html += '<div class="en-line" id="en-'+key+'" style="'+(st&&st.visible?'':'display:none')+'">'+( st ? '🇬🇧 '+st.text : '')+'</div>';
        html += '</li>';
      });
      html += '</ul></div>';
    });
    html += '</div>';
  });

  if (!totalFound) {
    html = '<div class="search-empty">Geen resultaten gevonden voor "<strong>'+searchQuery+'</strong>"</div>';
  }
  container.innerHTML = html;
}

// ─── SHUFFLE ──────────────────────────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ─── EXAM STATE ───────────────────────────────────────────────────────────────
var examQuestions = [];
var examAnswers = [];
var examSubmitted = false;
var examTimerInterval = null;
var examSecondsLeft = 45 * 60; // 45 minutes

// ─── EXAM FUNCTIONS ───────────────────────────────────────────────────────────
function clearWrongQs() {
  localStorage.removeItem('knm_wrong_qs');
  // Re-render result to update the message
  var el = document.querySelector('.result-box div[style*="margin-top:12px"]');
  if (el) el.remove();
}

function startExam() {
  // Check for saved progress from an incomplete exam (within 2 hours)
  try {
    var saved = JSON.parse(localStorage.getItem('knm_exam_progress') || 'null');
    if (saved && saved.questions && saved.questions.length && (Date.now() - saved.ts) < 7200000) {
      var answeredCount = saved.answers.filter(function(a) { return a !== -1; }).length;
      if (answeredCount > 0 && confirm('Je hebt een onvoltooid examen (' + answeredCount + '/' + saved.questions.length + ' vragen beantwoord). Wil je verdergaan?')) {
        examQuestions = saved.questions;
        examAnswers = saved.answers;
        examSecondsLeft = saved.secondsLeft || 45 * 60;
        examSubmitted = false;
        document.getElementById('mainWrap').style.display = 'none';
        document.getElementById('examWrap').style.display = 'block';
        renderExam();
        startTimer();
        setTimeout(applyHeaderOffset, 50);
        window.scrollTo(0, 0);
        return;
      }
    }
  } catch(e) {}

  clearExamProgress();
  var totalSlots = 40;
  var maxBlanks = Math.floor(totalSlots * 0.09); // <10% → max 3 blank questions

  // Load previously wrong questions
  var wrongQs = [];
  try { wrongQs = JSON.parse(localStorage.getItem('knm_wrong_qs') || '[]'); } catch(e) {}

  // Separate pools
  var regularPool = allQuestions.slice();
  var blankPool = typeof blankQuestions !== 'undefined' ? blankQuestions.slice() : [];

  // Pick blank questions (capped at maxBlanks)
  var pickedBlanks = shuffle(blankPool).slice(0, maxBlanks);

  // Reserve slots for wrong questions (up to half of totalSlots)
  var wrongSlots = Math.min(wrongQs.length, Math.floor(totalSlots / 2));
  var guaranteedWrong = shuffle(wrongQs).slice(0, wrongSlots);

  // Build set of question texts already included
  var usedTexts = {};
  pickedBlanks.forEach(function(q) { usedTexts[q.q] = true; });
  guaranteedWrong.forEach(function(q) { usedTexts[q.q] = true; });

  // Fill remaining slots with regular questions (not already included)
  var regularSlots = totalSlots - pickedBlanks.length - guaranteedWrong.length;
  var filteredRegular = regularPool.filter(function(q) { return !usedTexts[q.q]; });

  var byTheme = {};
  filteredRegular.forEach(function(q) {
    if (!byTheme[q.theme]) byTheme[q.theme] = [];
    byTheme[q.theme].push(q);
  });

  var themes = shuffle(Object.keys(byTheme));
  var base = Math.floor(regularSlots / themes.length);
  var remainder = regularSlots % themes.length;
  var pickedRegular = [];
  themes.forEach(function(theme, idx) {
    var slots = base + (idx < remainder ? 1 : 0);
    pickedRegular = pickedRegular.concat(shuffle(byTheme[theme]).slice(0, slots));
  });

  // Combine all: wrong questions first, then regular (grouped by theme), blanks scattered
  var combined = guaranteedWrong.concat(pickedRegular);
  pickedBlanks.forEach(function(bq) {
    var pos = Math.floor(Math.random() * (combined.length + 1));
    combined.splice(pos, 0, bq);
  });

  // Re-group by theme so same-theme questions stay together
  var seen = {};
  var themeOrder = [];
  combined.forEach(function(q) {
    if (!seen[q.theme]) { themeOrder.push(q.theme); seen[q.theme] = []; }
    seen[q.theme].push(q);
  });
  examQuestions = [];
  themeOrder.forEach(function(theme) { examQuestions = examQuestions.concat(seen[theme]); });

  // If we have wrong questions, mark them so they can be highlighted
  examQuestions._wrongTexts = {};
  guaranteedWrong.forEach(function(q) { examQuestions._wrongTexts[q.q] = true; });

  examAnswers = new Array(examQuestions.length).fill(-1);
  examSubmitted = false;
  document.getElementById('mainWrap').style.display = 'none';
  document.getElementById('examWrap').style.display = 'block';
  renderExam();
  startTimer();
  setTimeout(applyHeaderOffset, 50);
  window.scrollTo(0, 0);
}

function startTimer() {
  if (examTimerInterval) clearInterval(examTimerInterval);
  examSecondsLeft = 45 * 60;
  updateTimerDisplay();
  examTimerInterval = setInterval(function() {
    examSecondsLeft--;
    updateTimerDisplay();
    if (examSecondsLeft % 30 === 0) saveExamProgress(); // autosave every 30s
    if (examSecondsLeft <= 0) {
      clearInterval(examTimerInterval);
      if (!examSubmitted) submitExam();
    }
  }, 1000);
}

function stopTimer() {
  if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}

function updateTimerDisplay() {
  var el = document.getElementById('examTimer');
  if (!el) return;
  var m = Math.floor(examSecondsLeft / 60);
  var s = examSecondsLeft % 60;
  el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  // Turn red in last 5 minutes
  el.className = 'exam-timer' + (examSecondsLeft <= 300 ? ' timer-urgent' : '');
}

function backToGuide() {
  stopTimer();
  clearExamProgress();
  document.getElementById('examWrap').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  window.scrollTo(0, 0);
}

function saveExamProgress() {
  try {
    localStorage.setItem('knm_exam_progress', JSON.stringify({
      questions: examQuestions,
      answers: examAnswers,
      secondsLeft: examSecondsLeft,
      ts: Date.now()
    }));
  } catch(e) {}
}

function clearExamProgress() {
  localStorage.removeItem('knm_exam_progress');
}

function selectAnswer(qIdx, optIdx) {
  if (examSubmitted) return;
  // If already answered, don't allow change
  if (examAnswers[qIdx] !== -1) return;

  examAnswers[qIdx] = optIdx;
  var correctIdx = examQuestions[qIdx].a;
  var isCorrect = optIdx === correctIdx;

  // Save answer to localStorage immediately
  saveExamProgress();

  // Update wrong question queue immediately (add if wrong, remove if correct)
  try {
    var wrongQs = JSON.parse(localStorage.getItem('knm_wrong_qs') || '[]');
    var qText = examQuestions[qIdx].q;
    if (isCorrect) {
      wrongQs = wrongQs.filter(function(q) { return q.q !== qText; });
    } else {
      if (!wrongQs.some(function(q) { return q.q === qText; })) {
        wrongQs.push(examQuestions[qIdx]);
      }
    }
    localStorage.setItem('knm_wrong_qs', JSON.stringify(wrongQs));
    updateSavedCount();
  } catch(e) {}

  // Show immediate feedback on all options for this question
  document.querySelectorAll('.opt-btn[data-q="' + qIdx + '"]').forEach(function(btn) {
    var o = parseInt(btn.getAttribute('data-o'));
    btn.disabled = true;
    if (o === correctIdx) {
      btn.className = 'opt-btn correct';
    } else if (o === optIdx && !isCorrect) {
      btn.className = 'opt-btn wrong';
    } else {
      btn.className = 'opt-btn';
      btn.style.opacity = '0.5';
    }
    // Add UK flag toggle for translation — inside the button
    var optText = examQuestions[qIdx].opts[o];
    var optEn = (typeof optionTranslations !== 'undefined') ? (optionTranslations[optText] || '') : '';
    if (optEn) {
      var uid = 'optr-' + qIdx + '-' + o;
      var wrap = document.createElement('span');
      wrap.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin-left:8px;';
      var flag = document.createElement('button');
      flag.className = 'translate-btn';
      flag.title = 'Show translation';
      flag.textContent = '🇬🇧';
      flag.style.cssText = 'font-size:13px;vertical-align:middle;';
      var enSpan = document.createElement('span');
      enSpan.id = uid;
      enSpan.style.cssText = 'font-size:12px;color:inherit;font-style:italic;display:none;opacity:0.8;';
      enSpan.textContent = optEn;
      flag.onclick = function(e) {
        e.stopPropagation();
        var visible = enSpan.style.display !== 'none';
        enSpan.style.display = visible ? 'none' : 'inline';
        flag.classList.toggle('active', !visible);
      };
      wrap.appendChild(flag);
      wrap.appendChild(enSpan);
      btn.appendChild(wrap);
    }
  });

  // Show ✓ / ✗ badge and English translation on the question card
  var card = document.querySelector('.q-card[data-qi="' + qIdx + '"]');
  if (card) {
    var badge = card.querySelector('.q-feedback');
    if (badge) {
      badge.innerHTML = isCorrect
        ? '<span style="color:#3B6D11;">✓ Correct</span>'
        : '<span style="color:#A32D2D;">✗ Wrong</span>';
    }
    var enEl = card.querySelector('.q-en-translation');
    if (enEl) {
      var qText = examQuestions[qIdx].q;
      var qEn = (typeof questionTranslations !== 'undefined' && questionTranslations[qText])
             || (typeof blankQuestionTranslations !== 'undefined' && blankQuestionTranslations[qText])
             || '';
      if (qEn) { enEl.textContent = '🇬🇧 ' + qEn; enEl.style.display = 'block'; }
    }
  }

  var answered = examAnswers.filter(function(a) { return a !== -1; }).length;
  var total = examQuestions.length;
  var sb = document.getElementById('submitBtn');
  if (sb) sb.textContent = 'See results (' + answered + '/' + total + ')';
  var bar = document.getElementById('progressBar');
  if (bar) bar.style.width = Math.round(answered / total * 100) + '%';
}

function submitExam() {
  examSubmitted = true;
  stopTimer();
  clearExamProgress();
  var score = 0;
  var wrongQs = [];
  examQuestions.forEach(function(q, i) {
    if (examAnswers[i] === q.a) {
      score++;
    } else {
      wrongQs.push(q);
    }
  });

  // Save wrong questions for next exam (deduplicated by question text)
  var existing = [];
  try { existing = JSON.parse(localStorage.getItem('knm_wrong_qs') || '[]'); } catch(e) {}
  var existingTexts = existing.map(function(q){ return q.q; });
  wrongQs.forEach(function(q) {
    if (!existingTexts.includes(q.q)) { existing.push(q); existingTexts.push(q.q); }
  });
  localStorage.setItem('knm_wrong_qs', JSON.stringify(existing));

  var pass = score >= 26;

  // Save exam result to history
  var history = [];
  try { history = JSON.parse(localStorage.getItem('knm_history') || '[]'); } catch(e) {}
  history.unshift({
    date: new Date().toLocaleDateString('nl-NL', { day:'numeric', month:'short', year:'numeric' }),
    time: new Date().toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' }),

  resultHtml += '</div>';

  // ── EXAM HISTORY ────────────────────────────────────────────────────────────
  if (history.length > 1) {
    resultHtml += '<div style="margin-bottom:24px;">';
    resultHtml += '<p style="font-size:14px;font-weight:700;color:#1a1a1a;margin:0 0 10px;">📊 Examengeschiedenis</p>';
    resultHtml += '<div style="border-radius:10px;overflow:hidden;border:1px solid #e8e8e8;">';
    resultHtml += '<table style="width:100%;border-collapse:collapse;font-size:13px;">';

    resultHtml += '<th style="padding:8px 12px;text-align:left;color:#6b6b6b;font-weight:600;">Datum</th>';
    resultHtml += '<th style="padding:8px 12px;text-align:center;color:#6b6b6b;font-weight:600;">Score</th>';
    resultHtml += '<th style="padding:8px 12px;text-align:center;color:#6b6b6b;font-weight:600;">%</th>';
    resultHtml += '<th style="padding:8px 12px;text-align:center;color:#6b6b6b;font-weight:600;">Resultaat</th>';
    resultHtml += '</tr></thead><tbody>';
    history.forEach(function(h, idx) {
      var pct = Math.round(h.score / h.total * 100);
      var isLatest = idx === 0;
      var rowBg = isLatest ? 'background:#fffbeb;' : (idx % 2 === 0 ? '' : 'background:#fafafa;');
      resultHtml += '<tr style="' + rowBg + 'border-top:1px solid #f0f0f0;">';
      resultHtml += '<td style="padding:8px 12px;color:#1a1a1a;">' + h.date + ' ' + (h.time || '') + (isLatest ? ' <span style="font-size:10px;background:#F5C842;color:#1a1a1a;padding:1px 6px;border-radius:10px;font-weight:700;">Nu</span>' : '') + '</td>';
      resultHtml += '<td style="padding:8px 12px;text-align:center;font-weight:600;color:#1a1a1a;">' + h.score + '/' + h.total + '</td>';

    var userAns = examAnswers[i], correct_ans = q.a, isCorrect = userAns === correct_ans;

function renderExam() {
  var html = '<div class="exam-top"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">';
  html += '<div><h2>📝 KNM Practice Exam</h2><p>40 vragen · Minimaal 26 goed om te slagen</p></div>';
  html += '<div style="display:flex;align-items:center;gap:10px;">';
  html += '<div class="exam-timer" id="examTimer">45:00</div>';
  html += '<button class="restart-btn" onclick="backToGuide()">← Terug</button>';
  html += '</div>';
  html += '</div>';
  html += '<div class="progress-bar-wrap" style="margin:8px 0 0;border-radius:0;"><div class="progress-bar-inner" id="progressBar" style="width:0%"></div></div>';
  html += '</div>';

  var lastTheme = null;
  examQuestions.forEach(function(q, i) {
    if (q.theme !== lastTheme) {
      html += '<div class="exam-theme-header">' + q.theme + '</div>';
      lastTheme = q.theme;
    }
    var answered = examAnswers[i] !== -1;
    var isRetry = examQuestions._wrongTexts && examQuestions._wrongTexts[q.q];
    html += '<div class="q-card" data-qi="' + i + '">';
    html += '<div class="q-num" style="display:flex;justify-content:space-between;align-items:center;">';
    html += '<span>Vraag ' + (i + 1) + ' van ' + examQuestions.length + (isRetry ? ' <span style="font-size:11px;background:#fff8e6;color:#7a5c00;padding:1px 7px;border-radius:10px;font-weight:600;">📌 Retry</span>' : '') + '</span>';
    html += '<span class="q-feedback" style="font-weight:600;font-size:13px;">';
    if (answered) {
      var correct = examAnswers[i] === q.a;
      html += correct ? '<span style="color:#3B6D11;">✓ Correct</span>' : '<span style="color:#A32D2D;">✗ Wrong</span>';
    }
    html += '</span></div>';
    html += '<div class="q-text">' + q.q + '</div>';
    html += '<div class="q-en-translation" style="display:' + (answered ? 'block' : 'none') + ';font-size:13px;color:#6b6b6b;font-style:italic;margin:-4px 0 10px;">';
    if (answered) {
      var qEn = (typeof questionTranslations !== 'undefined' && questionTranslations[q.q])
             || (typeof blankQuestionTranslations !== 'undefined' && blankQuestionTranslations[q.q])
             || '';
      if (qEn) html += '🇬🇧 ' + qEn;
    }
    html += '</div>';
    q.opts.forEach(function(opt, oi) {
      var cls = 'opt-btn';
      var extraStyle = '';
      if (answered) {
        if (oi === q.a) cls += ' correct';
        else if (oi === examAnswers[i]) cls += ' wrong';
        else extraStyle = 'opacity:0.5;';
      } else if (examAnswers[i] === oi) {
        cls += ' selected';
      }
      var optEn = answered ? ((typeof optionTranslations !== 'undefined') ? (optionTranslations[opt] || '') : '') : '';
      html += '<button class="' + cls + '" style="' + extraStyle + '" data-q="' + i + '" data-o="' + oi + '" onclick="selectAnswer(' + i + ',' + oi + ')" ' + (answered ? 'disabled' : '') + '>';
      html += String.fromCharCode(65 + oi) + '. ' + opt;
      if (answered && optEn) {
        var uid = 'optr-' + i + '-' + oi;
        html += '<span style="display:inline-flex;align-items:center;gap:6px;margin-left:8px;">';
        html += '<button class="translate-btn" style="font-size:13px;" onclick="event.stopPropagation();(function(el,btn){var v=el.style.display!==\'none\';el.style.display=v?\'none\':\'inline\';btn.classList.toggle(\'active\',!v);})(document.getElementById(\'' + uid + '\'),this)" title="Show translation">🇬🇧</button>';
        html += '<span id="' + uid + '" style="font-size:12px;font-style:italic;display:none;opacity:0.8;">' + optEn + '</span>';
        html += '</span>';
      }
      html += '</button>';
    });
    html += '</div>';
  });
  html += '<div class="submit-row"><button class="submit-btn" id="submitBtn" onclick="submitExam()">Controleer antwoorden (0/40)</button></div>';
  document.getElementById('examInner').innerHTML = html;
}

var VERB_TAB = 9; // index for verbs tab

function renderNav() {
  var nav = document.getElementById('nav');
  var btns = topics.map(function(t, i) {
    var c = colorMap[t.color];
    var style = i===activeIdx ? 'background:'+c.bg+';color:'+c.text+';border-color:'+c.text+';font-weight:500;' : '';
    return '<button class="topic-btn" style="'+style+'" onclick="setTopic('+i+')">'
      + t.emoji+' '+t.title.split('&')[0].trim()
      + ' <span style="opacity:0.6;font-size:11px;">'+t.words.length+'</span></button>';
  });
  // Add verb tab
  var vStyle = activeIdx===VERB_TAB ? 'background:#fff8e6;color:#7a5c00;border-color:#F5C842;font-weight:500;' : '';
  btns.push('<button class="topic-btn" style="'+vStyle+'" onclick="setTopic('+VERB_TAB+')">📖 Werkwoorden <span style="opacity:0.6;font-size:11px;">'+verbData.length+'</span></button>');
  nav.innerHTML = btns.join('');
}

function renderVerbContent() {
  var typeOrder = ['modal','irregular','regular','sep'];
  var typeNames = { modal:'🟡 Modal Verbs', irregular:'🔵 Irregular Verbs', regular:'🟢 Regular Verbs', sep:'🔴 Separable Verbs' };
  var typeBg   = { modal:'#fffbeb', irregular:'#eef4fd', regular:'#f0faf0', sep:'#fff0f0' };
  var typeCol  = { modal:'#92400e', irregular:'#185FA5', regular:'#2d7a2d', sep:'#b91c1c' };

  // First call: build the static shell (header + controls + empty grid container)
  if (!document.getElementById('verbGrid')) {
    var html = '<div>';
    html += '<div class="section-header"><div class="section-num" style="background:#fff8e6;color:#7a5c00;">9</div>';
    html += '<div><p class="section-title">📖 Werkwoorden <span class="count-badge" style="background:#fff8e6;color:#7a5c00;">'+verbData.length+' verbs</span></p>';
    html += '<p class="section-sub">Most-used A2-level Dutch verbs — conjugations, past tense &amp; examples</p></div></div>';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">';
    html += '<input id="verbSearchInput" type="text" value="" placeholder="Search verb or meaning..." oninput="verbSearch=this.value;renderVerbGrid()" autocomplete="off" style="flex:1;min-width:180px;padding:7px 14px;border-radius:20px;border:1px solid #e8e8e8;font-family:Nunito,sans-serif;font-size:14px;outline:none;">';

      var labels = {all:'All',modal:'Modal',irregular:'Irregular',regular:'Regular',sep:'Separable'};

    });
    html += '</div>';
    html += '<p id="verbCount" style="font-size:13px;color:#6b6b6b;margin-bottom:14px;"></p>';
    html += '<div id="verbGrid"></div>';
    html += '</div>';
    document.getElementById('content').innerHTML = html;
  }

  renderVerbGrid();
}

function renderVerbGrid() {
  var typeOrder = ['modal','irregular','regular','sep'];
  var typeNames = { modal:'🟡 Modal Verbs', irregular:'🔵 Irregular Verbs', regular:'🟢 Regular Verbs', sep:'🔴 Separable Verbs' };

  var q = verbSearch.trim().toLowerCase();

  // Update filter button styles
  ['all','modal','irregular','regular','sep'].forEach(function(f) {
    var btn = document.getElementById('vfbtn-'+f);
    if (!btn) return;
    btn.style.background = verbFilter===f ? '#F5C842' : '#fcfcfd';
    btn.style.color = verbFilter===f ? '#1a1a1a' : '#1a1a1a';
    btn.style.borderColor = verbFilter===f ? '#F5C842' : '#e8e8e8';
  });

  var filtered = verbData.filter(function(v) {
    if (verbFilter !== 'all' && v.type !== verbFilter) return false;
    if (!q) return true;
    return v.name.toLowerCase().includes(q) || v.meaning.toLowerCase().includes(q);
  });

  var grouped = {};
  filtered.forEach(function(v) { if (!grouped[v.type]) grouped[v.type] = []; grouped[v.type].push(v); });

  var countEl = document.getElementById('verbCount');
  if (countEl) countEl.textContent = filtered.length + ' of ' + verbData.length + ' verbs shown';

  var html = '';
  if (!filtered.length) {
    html = '<div style="text-align:center;padding:3rem;color:#999;font-size:15px;">No verbs found for "'+q+'"</div>';
  } else {
    typeOrder.forEach(function(type) {
      if (!grouped[type]) return;
      html += '<p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b6b6b;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid #e8e8e8;">'+typeNames[type]+' ('+grouped[type].length+')</p>';
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:8px;">';
      grouped[type].forEach(function(v) {
        var hl = function(t){ return q ? t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark style="background:#fff176;border-radius:2px;padding:0 1px;">$1</mark>') : t; };
        html += '<div class="word-card" style="background:#fcfcfd;">';
        html += '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px;">';
        html += '<span style="font-size:16px;font-weight:700;color:#1a1a1a;">'+hl(v.name)+'</span>';
        html += '<span style="font-size:13px;color:#6b6b6b;flex:1;">'+hl(v.meaning)+'</span>';
        html += '</div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:8px;">';
        [['ik',v.ik],['jij/u',v.jij],['wij/zij',v.wij]].forEach(function(pair){
          html += '<div style="font-size:14px;"><span style="display:block;font-size:10px;font-weight:600;text-transform:uppercase;color:#6b6b6b;opacity:0.45;margin-bottom:1px;">'+pair[0]+'</span>'+pair[1]+'</div>';
        });
        html += '</div>';
        html += '<div style="display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap;">';
        html += '<div style="font-size:12px;"><span style="font-size:10px;font-weight:600;text-transform:uppercase;color:#6b6b6b;">Past </span><span style="font-weight:600;color:#7a5c00;">'+v.past+'</span></div>';
        html += '<div style="font-size:12px;"><span style="font-size:10px;font-weight:600;text-transform:uppercase;color:#6b6b6b;">Participle </span><span style="font-weight:600;color:#7a5c00;">'+v.participle+'</span></div>';
        html += '</div>';
        html += '<div style="font-size:12px;color:#6b6b6b;font-style:italic;border-top:1px solid #e8e8e8;padding-top:8px;line-height:1.5;">'+v.ex+'</div>';
        html += '</div>';
      });
      html += '</div>';
    });
  }

  document.getElementById('verbGrid').innerHTML = html;
}

function renderContent() {
  if (activeIdx === VERB_TAB) { renderVerbContent(); return; }
  var t = topics[activeIdx];
  var c = colorMap[t.color];

  var html = '<div><div class="section-header">';
  html += '<div class="section-num" style="background:'+c.bg+';color:'+c.text+'">'+(activeIdx+1)+'</div>';
  html += '<div><p class="section-title">'+t.emoji+' '+t.title;
  html += ' <span class="count-badge" style="background:'+c.bg+';color:'+c.text+'">'+t.words.length+' begrippen</span></p>';
  html += '<p class="section-sub">'+t.sub+'</p></div></div>';

  var words = shuffle(t.words.slice());
  words.forEach(function(entry, wordIdx) {
    var origIdx = t.words.indexOf(entry);
    html += '<div class="word-card">';

    // Word title + speaker button (Dutch portion only)
    var dutchTitle = entry.w.replace(/\s*\([^)]*\)\s*$/, '').trim();
    var safeDutchTitle = dutchTitle.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html += '<div class="word-title-row">';
    html += '<button class="save-word-btn'+(isSaved(t.id,origIdx)?' saved':'')+'" onclick="toggleSaveWord(\''+t.id+'\','+origIdx+',this)" title="Sla op">🔖</button>';
    html += '<p class="word-title">'+entry.w+'</p>';
    html += '<button class="speak-btn speak-title" onclick="speakDutch(\''+safeDutchTitle+'\',this)" title="Hoor uitspraak begrip">🔊</button>';
    html += '</div>';

    html += '<ul class="word-body">';
    entry.nl.forEach(function(line, lineIdx) {
      var key = t.id + '-' + origIdx + '-' + lineIdx;
      sentenceMap[key] = { nl: line, en: entry.en };
      var st = sentenceTranslations[key];
      var safeLine = line.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html += '<li>';
      html += '<div class="sentence-row">';
      html += '<span class="nl-text">'+line+'</span>';
      html += '<button class="speak-btn" onclick="speakDutch(\''+safeLine+'\',this)" title="Uitspraakoefening">🔊</button>';
      html += '<button class="translate-btn'+(st&&st.visible?' active':'')+'" id="tbtn-'+key+'" onclick="toggleTranslation(\''+key+'\',this)" title="Toon vertaling">🇬🇧</button>';
      html += '</div>';
      html += '<div class="en-line" id="en-'+key+'" style="'+(st&&st.visible?'':'display:none')+'">'+(st?'🇬🇧 '+st.text:'')+'</div>';
      html += '</li>';
    });
    html += '</ul>';
    html += '</div>';
  });

  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function setTopic(i) {
  activeIdx = i;
  savedPanelOpen = false;
  document.getElementById('savedPanel').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('content').innerHTML = '';
  var nav = document.getElementById('nav');
  if (nav) nav.style.display = ''; // clear shell so verb tab rebuilds
  var si = document.getElementById('searchInput');
  if (si) si.value = '';
  searchQuery = '';
  document.getElementById('searchResults').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  renderNav();
  renderContent();
}

renderNav();
renderContent();
updateSavedCount();

// ── MOBILE OFFSET: push content below fixed header ───────────────────────────
function applyHeaderOffset() {
  if (window.innerWidth > 600) return;
  var hdr = document.querySelector('.header-box');
  if (!hdr) return;
  var h = hdr.getBoundingClientRect().height;
  var wrap = document.getElementById('mainWrap');
  var nav = document.getElementById('nav');
  var examWrap = document.getElementById('examWrap');
  var examTop = document.querySelector('.exam-top');
  if (wrap) wrap.style.paddingTop = (h + 8) + 'px';
  if (nav) nav.style.top = h + 'px';
  if (examWrap && examTop) {
    var eh = examTop.getBoundingClientRect().height;
    examWrap.style.paddingTop = (eh + 8) + 'px';
  }
}
applyHeaderOffset();
window.addEventListener('resize', applyHeaderOffset);
